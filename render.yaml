# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo → apply.
# After deploy, open the web service → Environment → set sync: false secrets (or generate JWT below).

services:
  - type: web
    name: brokerai
    runtime: docker
    region: oregon
    # Use `starter` or higher if `free` is unavailable for Docker in your workspace.
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: AYRSHARE_API_KEY
        sync: false
      - key: AYRSHARE_SSO_DOMAIN
        sync: false
      # Preferred: base64-encoded PEM — avoids multiline paste issues in Render dashboard.
      # Run: base64 -i id-YF7L--private-key.pem | tr -d '\n'  and paste the result.
      - key: AYRSHARE_PRIVATE_KEY_BASE64_VALUE
        sync: false
      # Alternative: paste full PEM with real newlines (Render supports multiline values).
      # Leave empty if using AYRSHARE_PRIVATE_KEY_BASE64_VALUE above.
      - key: AYRSHARE_PRIVATE_KEY
        sync: false
      - key: BROKERAI_PUBLIC_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
