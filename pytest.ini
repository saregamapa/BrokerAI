[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
addopts = --tb=short
markers =
    e2e: End-to-end tests requiring a running BrokerAI server at localhost:8000
    slow: Slow-running tests (integration-level, may hit external services)

# Coverage target for CI.  Overall 80%+ on the unit-testable service modules.
# Run with: pytest --ignore=tests/e2e --cov=backend --cov-config=.coveragerc --cov-fail-under=80
# (coverage report will exclude large integration entry-points main.py and nodes.py)

