<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BrokerAI — Manage your Canva design templates." />
    <title>Templates — BrokerAI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x26A1;</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body
    class="brokerai-app min-h-screen bg-[#f9fafb] text-slate-900 antialiased"
    data-page="templates"
  >
    <div
      id="brokerai-loading"
      class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-white/70 backdrop-blur-sm"
    >
      <div class="flex flex-col items-center gap-3 rounded-2xl border border-slate-200 bg-white/90 p-8 shadow-xl">
        <div class="brokerai-spinner" aria-label="Loading"></div>
        <p class="text-sm font-medium text-slate-700">Loading...</p>
      </div>
    </div>

    <div
      id="app-sidebar-overlay"
      class="fixed inset-0 z-30 hidden bg-slate-900/40 backdrop-blur-sm md:hidden"
      aria-hidden="true"
    ></div>
    <aside
      id="app-sidebar"
      class="fixed inset-y-0 left-0 z-40 w-64 border-r border-slate-800/80 bg-[#0f172a] shadow-xl md:block"
    ></aside>

    <div class="flex min-h-screen flex-col md:pl-64">
      <header
        id="app-topnav"
        class="sticky top-0 z-20 border-b border-slate-200/80 bg-white/80 shadow-sm backdrop-blur-md"
      ></header>

      <main class="brokerai-page flex-1 bg-gradient-to-br from-[#f9fafb] via-white to-amber-50/20 px-4 py-8 md:px-8">
        <div class="mx-auto max-w-6xl">

          <!-- Header -->
          <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mb-8">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">My Templates</h1>
              <p class="mt-1 text-sm text-slate-500">Create and manage Canva design templates for your campaigns.</p>
            </div>
            <button
              type="button"
              id="btn-new-design"
              class="inline-flex items-center gap-1.5 rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 px-5 py-2.5 text-sm font-bold text-white shadow-md shadow-amber-500/20 transition duration-200 hover:scale-105 active:scale-95"
            >
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
              New Design
            </button>
          </div>

          <!-- Filter bar -->
          <div class="mb-6 flex flex-wrap items-center gap-3">
            <label class="text-sm font-medium text-slate-600">Filter:</label>
            <select id="filter-type" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm shadow-sm focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400/20">
              <option value="">All Types</option>
              <option value="instagram-post">Instagram Post</option>
              <option value="instagram-story">Instagram Story</option>
              <option value="instagram-reel">Instagram Reel</option>
              <option value="facebook-post">Facebook Post</option>
              <option value="facebook-cover">Facebook Cover</option>
              <option value="linkedin-post">LinkedIn Post</option>
              <option value="linkedin-banner">LinkedIn Banner</option>
              <option value="presentation">Presentation</option>
              <option value="square-post">Square Post</option>
              <option value="vertical-video">Vertical Video</option>
            </select>
            <select id="filter-status" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm shadow-sm focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400/20">
              <option value="">All Statuses</option>
              <option value="ready">Ready</option>
              <option value="imported">Imported</option>
              <option value="pending">Pending</option>
              <option value="failed">Failed</option>
            </select>
          </div>

          <!-- Empty state -->
          <div id="empty-state" class="hidden rounded-2xl border-2 border-dashed border-slate-200 p-12 text-center">
            <svg class="mx-auto h-12 w-12 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
            <h3 class="mt-4 text-lg font-semibold text-slate-700">No templates yet</h3>
            <p class="mt-2 text-sm text-slate-500">Create your first design template to get started.</p>
          </div>

          <!-- Template grid -->
          <div id="template-grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>

        </div>
      </main>
    </div>

    <!-- New Design Modal -->
    <div id="modal-new-design" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm">
      <div class="mx-4 w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-lg font-bold text-slate-900">Create New Design</h2>
          <button type="button" id="modal-close" class="rounded-lg p-1.5 text-slate-400 transition hover:bg-slate-100 hover:text-slate-600">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Design Title</label>
          <input type="text" id="new-design-title" placeholder="My Campaign Template" class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm shadow-sm focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400/20" />
        </div>
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Design Type</label>
          <div id="type-grid" class="grid grid-cols-2 gap-2 max-h-56 overflow-y-auto"></div>
        </div>
        <div class="flex justify-end gap-3">
          <button type="button" id="modal-cancel" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50">Cancel</button>
          <button type="button" id="modal-create" class="rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 px-5 py-2 text-sm font-bold text-white shadow-md transition hover:scale-105 active:scale-95">Create in Canva</button>
        </div>
      </div>
    </div>

    <!-- Import Modal -->
    <div id="modal-import" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm">
      <div class="mx-4 w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-lg font-bold text-slate-900">Import Design</h2>
          <button type="button" id="import-modal-close" class="rounded-lg p-1.5 text-slate-400 transition hover:bg-slate-100 hover:text-slate-600">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <p class="mb-3 text-sm text-slate-500">Paste the exported image/video URL from your Canva design.</p>
        <input type="url" id="import-export-url" placeholder="https://..." class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm shadow-sm focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-400/20 mb-4" />
        <div class="flex justify-end gap-3">
          <button type="button" id="import-cancel" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50">Cancel</button>
          <button type="button" id="import-submit" class="rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 px-5 py-2 text-sm font-bold text-white shadow-md transition hover:scale-105 active:scale-95">Import</button>
        </div>
      </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/nav.js"></script>
    <script>
    (function () {
      var api = window.BrokerAI;
      if (!api || !api.getToken || !api.getToken()) { window.location.href = "/login.html"; return; }

      var DESIGN_TYPES = {
        "instagram-post": "Instagram Post",
        "instagram-story": "Instagram Story",
        "instagram-reel": "Instagram Reel",
        "facebook-post": "Facebook Post",
        "facebook-cover": "Facebook Cover",
        "linkedin-post": "LinkedIn Post",
        "linkedin-banner": "LinkedIn Banner",
        "presentation": "Presentation",
        "square-post": "Square Post",
        "vertical-video": "Vertical Video",
        "custom": "Custom Size",
      };

      var STATUS_COLORS = {
        ready: "bg-emerald-100 text-emerald-700",
        imported: "bg-blue-100 text-blue-700",
        pending: "bg-amber-100 text-amber-700",
        failed: "bg-red-100 text-red-700",
        "link-out": "bg-slate-100 text-slate-600",
      };

      var selectedType = "instagram-post";
      var importDesignId = null;

      // --- Load Templates ---
      function loadTemplates() {
        var typeFilter = document.getElementById("filter-type").value;
        var statusFilter = document.getElementById("filter-status").value;
        var params = new URLSearchParams();
        if (typeFilter) params.set("design_type", typeFilter);
        if (statusFilter) params.set("status", statusFilter);
        var url = "/canva/designs" + (params.toString() ? "?" + params.toString() : "");

        api.apiJson(url, { method: "GET" }).then(function (res) {
          var items = res.items || [];
          var grid = document.getElementById("template-grid");
          var empty = document.getElementById("empty-state");

          if (!items.length) {
            grid.innerHTML = "";
            empty.classList.remove("hidden");
            return;
          }
          empty.classList.add("hidden");

          grid.innerHTML = items.map(function (d) {
            var thumb = d.thumbnail_url || "";
            var statusCls = STATUS_COLORS[d.status] || STATUS_COLORS["pending"];
            var typeName = DESIGN_TYPES[d.design_type] || d.design_type || "Design";
            return (
              '<div class="group relative overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:shadow-lg hover:-translate-y-0.5">' +
                '<div class="aspect-[4/5] bg-slate-100 overflow-hidden">' +
                  (thumb
                    ? '<img src="' + thumb + '" alt="' + (d.title || "Template") + '" class="h-full w-full object-cover transition group-hover:scale-105" />'
                    : '<div class="flex h-full items-center justify-center text-slate-300"><svg class="h-12 w-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>'
                  ) +
                '</div>' +
                '<div class="p-3">' +
                  '<p class="truncate text-sm font-semibold text-slate-800">' + (d.title || "Untitled") + '</p>' +
                  '<div class="mt-1.5 flex flex-wrap items-center gap-1.5">' +
                    '<span class="rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-medium text-slate-600">' + typeName + '</span>' +
                    '<span class="rounded-full px-2 py-0.5 text-[10px] font-medium ' + statusCls + '">' + (d.status || "unknown") + '</span>' +
                  '</div>' +
                  '<div class="mt-3 flex gap-2">' +
                    (d.edit_url ? '<a href="' + d.edit_url + '" target="_blank" rel="noopener" class="flex-1 rounded-lg border border-slate-200 px-2.5 py-1.5 text-center text-xs font-medium text-slate-600 transition hover:bg-slate-50">Open in Canva</a>' : '') +
                    '<button type="button" onclick="window.__importDesign(' + d.id + ')" class="flex-1 rounded-lg border border-amber-200 bg-amber-50 px-2.5 py-1.5 text-xs font-medium text-amber-700 transition hover:bg-amber-100">Import</button>' +
                    '<button type="button" onclick="window.__deleteDesign(' + d.id + ')" class="rounded-lg border border-red-200 px-2 py-1.5 text-xs font-medium text-red-500 transition hover:bg-red-50" title="Delete">' +
                      '<svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
                    '</button>' +
                  '</div>' +
                '</div>' +
              '</div>'
            );
          }).join("");
        }).catch(function (err) {
          api.showToast("Failed to load templates", "error");
        });
      }

      // --- New Design Modal ---
      var newModal = document.getElementById("modal-new-design");
      var typeGridEl = document.getElementById("type-grid");

      function renderTypeGrid() {
        typeGridEl.innerHTML = Object.keys(DESIGN_TYPES).map(function (k) {
          var active = k === selectedType;
          return (
            '<button type="button" data-type="' + k + '" class="rounded-lg border px-3 py-2.5 text-left text-sm font-medium transition ' +
            (active ? 'border-amber-400 bg-amber-50 text-amber-800 ring-2 ring-amber-400/30' : 'border-slate-200 text-slate-600 hover:border-slate-300 hover:bg-slate-50') +
            '">' + DESIGN_TYPES[k] + '</button>'
          );
        }).join("");
        typeGridEl.querySelectorAll("button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            selectedType = btn.getAttribute("data-type");
            renderTypeGrid();
          });
        });
      }

      document.getElementById("btn-new-design").addEventListener("click", function () {
        document.getElementById("new-design-title").value = "";
        selectedType = "instagram-post";
        renderTypeGrid();
        newModal.classList.remove("hidden");
        newModal.classList.add("flex");
      });

      function closeNewModal() {
        newModal.classList.add("hidden");
        newModal.classList.remove("flex");
      }
      document.getElementById("modal-close").addEventListener("click", closeNewModal);
      document.getElementById("modal-cancel").addEventListener("click", closeNewModal);

      document.getElementById("modal-create").addEventListener("click", function () {
        var title = document.getElementById("new-design-title").value.trim() || ("BrokerAI " + (DESIGN_TYPES[selectedType] || "Design"));
        api.apiJson("/canva/designs", {
          method: "POST",
          body: JSON.stringify({ title: title, design_type: selectedType }),
        }).then(function (d) {
          closeNewModal();
          api.showToast("Design created! Opening Canva...", "success");
          if (d.edit_url) window.open(d.edit_url, "_blank");
          loadTemplates();
        }).catch(function () {
          api.showToast("Failed to create design", "error");
        });
      });

      // --- Import Modal ---
      var importModal = document.getElementById("modal-import");

      window.__importDesign = function (id) {
        importDesignId = id;
        document.getElementById("import-export-url").value = "";
        importModal.classList.remove("hidden");
        importModal.classList.add("flex");
      };

      function closeImportModal() {
        importModal.classList.add("hidden");
        importModal.classList.remove("flex");
        importDesignId = null;
      }
      document.getElementById("import-modal-close").addEventListener("click", closeImportModal);
      document.getElementById("import-cancel").addEventListener("click", closeImportModal);

      document.getElementById("import-submit").addEventListener("click", function () {
        var url = document.getElementById("import-export-url").value.trim();
        if (!url || !importDesignId) { api.showToast("Please enter a URL", "error"); return; }
        api.apiJson("/canva/designs/" + importDesignId + "/import", {
          method: "POST",
          body: JSON.stringify({ export_url: url }),
        }).then(function () {
          closeImportModal();
          api.showToast("Design imported successfully!", "success");
          loadTemplates();
        }).catch(function () {
          api.showToast("Failed to import design", "error");
        });
      });

      // --- Delete ---
      window.__deleteDesign = function (id) {
        if (window.BrokerAI && BrokerAI.confirmDialog) {
          BrokerAI.confirmDialog({ title: "Delete Template", body: "This will permanently remove this design. Continue?", confirmLabel: "Delete", danger: true })
            .then(function (ok) { if (ok) doDelete(id); });
        } else if (confirm("Delete this template?")) {
          doDelete(id);
        }
      };

      function doDelete(id) {
        api.apiJson("/canva/designs/" + id, { method: "DELETE" }).then(function () {
          api.showToast("Template deleted", "success");
          loadTemplates();
        }).catch(function () {
          api.showToast("Failed to delete template", "error");
        });
      }

      // --- Filter listeners ---
      document.getElementById("filter-type").addEventListener("change", loadTemplates);
      document.getElementById("filter-status").addEventListener("change", loadTemplates);

      // --- Init ---
      loadTemplates();
    })();
    </script>
  </body>
</html>
