<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BrokerAI — AI-powered social media campaigns for any business. Generate, schedule, and publish a month of content in minutes." />
    <meta name="og:site_name" content="BrokerAI" />
    <meta property="og:type" content="website" />
    <title>Review Posts — BrokerAI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <style>
      /* ── Platform device frames ─────────────────────────────────────── */
      .device-frame-instagram {
        border-radius: 12px;
        border: 2px solid #e2e8f0;
        background: #fff;
        max-width: 340px;
        margin: 0 auto;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
      }
      .device-frame-instagram .df-header {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; border-bottom: 1px solid #f1f5f9;
      }
      .device-frame-instagram .df-avatar {
        width: 32px; height: 32px; border-radius: 50%;
        background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
        flex-shrink: 0;
      }
      .device-frame-instagram .df-name { font-size: 13px; font-weight: 600; color: #111; }
      .device-frame-instagram .df-caption { padding: 10px 12px; font-size: 13px; color: #1a1a1a; line-height: 1.5; }
      .device-frame-instagram .df-footer { padding: 8px 12px; display: flex; gap: 16px; border-top: 1px solid #f1f5f9; }
      .device-frame-instagram .df-footer span { font-size: 12px; color: #6b7280; cursor: default; }

      .device-frame-linkedin {
        border-radius: 8px; border: 1px solid #e0e0e0;
        background: #fff; max-width: 500px; margin: 0 auto;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
      }
      .device-frame-linkedin .df-header {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 16px;
      }
      .device-frame-linkedin .df-avatar {
        width: 48px; height: 48px; border-radius: 50%; background: #0a66c2; flex-shrink: 0;
      }
      .device-frame-linkedin .df-name { font-size: 14px; font-weight: 600; color: #1a1a1a; }
      .device-frame-linkedin .df-sub { font-size: 12px; color: #6b7280; }
      .device-frame-linkedin .df-caption { padding: 0 16px 12px; font-size: 14px; color: #1a1a1a; line-height: 1.6; }
      .device-frame-linkedin .df-footer { padding: 8px 16px; display: flex; gap: 20px; border-top: 1px solid #f1f5f9; }
      .device-frame-linkedin .df-footer span { font-size: 12px; color: #6b7280; cursor: default; }

      .device-frame-twitter {
        border-radius: 8px; border: 1px solid #e7e7e7;
        background: #fff; max-width: 480px; margin: 0 auto;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden; padding: 12px 16px;
      }
      .device-frame-twitter .df-header { display: flex; gap: 10px; margin-bottom: 8px; }
      .device-frame-twitter .df-avatar { width: 40px; height: 40px; border-radius: 50%; background: #1da1f2; flex-shrink: 0; }
      .device-frame-twitter .df-name { font-size: 15px; font-weight: 700; color: #1a1a1a; }
      .device-frame-twitter .df-handle { font-size: 13px; color: #6b7280; }
      .device-frame-twitter .df-caption { font-size: 15px; color: #1a1a1a; line-height: 1.5; margin-left: 50px; }
      .device-frame-twitter .df-footer { display: flex; gap: 20px; margin-top: 10px; margin-left: 50px; }
      .device-frame-twitter .df-footer span { font-size: 13px; color: #6b7280; cursor: default; }

      .device-frame-facebook {
        border-radius: 8px; border: 1px solid #dddfe2;
        background: #fff; max-width: 500px; margin: 0 auto;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
      }
      .device-frame-facebook .df-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
      .device-frame-facebook .df-avatar { width: 40px; height: 40px; border-radius: 50%; background: #1877f2; flex-shrink: 0; }
      .device-frame-facebook .df-name { font-size: 14px; font-weight: 600; color: #1a1a1a; }
      .device-frame-facebook .df-sub { font-size: 12px; color: #65676b; }
      .device-frame-facebook .df-caption { padding: 0 16px 12px; font-size: 14px; color: #1a1a1a; line-height: 1.5; }
      .device-frame-facebook .df-footer { display: flex; gap: 16px; padding: 8px 16px; border-top: 1px solid #f0f2f5; }
      .device-frame-facebook .df-footer span { font-size: 13px; color: #65676b; cursor: default; }
    </style>
  </head>
  <body
    class="brokerai-app min-h-screen bg-[#f9fafb] text-slate-900 antialiased"
    data-page="review"
  >
    <div
      id="brokerai-loading"
      class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-white/70 backdrop-blur-sm"
    >
      <div class="flex flex-col items-center gap-3 rounded-2xl border border-slate-200 bg-white/90 p-8 shadow-xl">
        <div class="brokerai-spinner" aria-label="Loading"></div>
        <p class="text-sm font-medium text-slate-700">Loading campaign…</p>
      </div>
    </div>

    <div
      id="publish-overlay"
      class="hidden fixed inset-0 z-[70] flex flex-col items-center justify-center bg-slate-900/40 px-4 backdrop-blur-md"
    >
      <div class="max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-2xl">
        <div class="brokerai-spinner mx-auto mb-4"></div>
        <p class="text-lg font-semibold text-slate-900">Approving your campaign…</p>
        <p class="mt-2 text-sm text-slate-600">
          Posts will be queued for publishing on their scheduled dates via Ayrshare.
        </p>
      </div>
    </div>

    <div
      id="app-sidebar-overlay"
      class="fixed inset-0 z-30 hidden bg-slate-900/40 backdrop-blur-sm md:hidden"
      aria-hidden="true"
    ></div>
    <aside
      id="app-sidebar"
      class="fixed inset-y-0 left-0 z-40 w-64 border-r border-slate-800/80 bg-[#0f172a] shadow-xl md:block"
    ></aside>

    <div id="app-layout" class="flex min-h-screen flex-col md:pl-64">
      <header
        id="app-topnav"
        class="sticky top-0 z-20 border-b border-slate-200/80 bg-white/80 shadow-sm backdrop-blur-md"
      ></header>

      <main class="brokerai-page flex-1 bg-gradient-to-br from-[#f9fafb] via-white to-amber-50/20 px-4 py-8 md:px-8">
        <div class="mx-auto max-w-5xl">
          <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
              <h1 class="text-2xl font-bold tracking-tight text-slate-900 md:text-3xl">Review your campaign</h1>
              <p class="mt-1 text-sm text-slate-600" id="campaign-meta"></p>
            </div>
            <div class="flex items-center gap-2">
              <button
                type="button"
                id="btn-report"
                onclick="downloadCampaignReport()"
                class="rounded-xl border border-amber-300 bg-amber-50 px-4 py-2 text-sm font-semibold text-amber-800 shadow-sm transition duration-200 hover:scale-105 hover:bg-amber-100 hover:shadow-md active:scale-95"
                title="Download a PDF performance report for this campaign"
              >
                &#x1F4C4; Download Report
              </button>
            </div>
          </div>

          <div id="summary-bar" class="mt-8 grid grid-cols-2 gap-3 sm:grid-cols-4">
            <div
              class="rounded-2xl border border-slate-200/80 bg-white/90 p-4 text-center shadow-lg backdrop-blur-md transition duration-300 hover:shadow-xl"
            >
              <div id="stat-total" class="text-2xl font-bold text-slate-900">0</div>
              <div class="text-xs font-medium text-slate-500">Total posts</div>
            </div>
            <div
              class="rounded-2xl border border-slate-200/80 bg-white/90 p-4 text-center shadow-lg backdrop-blur-md transition duration-300 hover:shadow-xl"
            >
              <div id="stat-compliant" class="text-2xl font-bold text-emerald-600">0</div>
              <div class="text-xs font-medium text-slate-500">Compliant</div>
            </div>
            <div
              class="rounded-2xl border border-slate-200/80 bg-white/90 p-4 text-center shadow-lg backdrop-blur-md transition duration-300 hover:shadow-xl"
            >
              <div id="stat-images" class="text-2xl font-bold text-amber-600">0</div>
              <div class="text-xs font-medium text-slate-500">With images</div>
            </div>
            <div
              class="rounded-2xl border border-slate-200/80 bg-white/90 p-4 text-center shadow-lg backdrop-blur-md transition duration-300 hover:shadow-xl"
            >
              <div id="stat-platforms" class="text-2xl font-bold text-sky-600">-</div>
              <div class="text-xs font-medium text-slate-500">Platforms</div>
            </div>
          </div>

          <div
            id="approve-wrap"
            class="mt-8 flex flex-col gap-4 rounded-2xl border border-amber-200/80 bg-gradient-to-br from-amber-50 to-white p-6 shadow-lg backdrop-blur-md sm:flex-row sm:items-center sm:justify-between"
          >
            <div>
              <p class="text-sm font-semibold text-slate-900">Ready to publish?</p>
              <p class="mt-0.5 text-xs text-slate-600">Approve the full campaign to schedule all posts.</p>
            </div>
            <button
              type="button"
              id="approve-campaign-btn"
              class="rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 px-8 py-3 text-sm font-bold text-white shadow-lg shadow-amber-500/25 transition duration-200 hover:scale-105 hover:shadow-xl active:scale-95 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:scale-100"
            >
              Approve &amp; schedule
            </button>
          </div>

          <div id="review-skeleton" class="mt-10 grid gap-4 sm:grid-cols-2 xl:grid-cols-3" style="display:none">
            <div class="brokerai-skeleton h-52 rounded-xl"></div>
            <div class="brokerai-skeleton h-52 rounded-xl"></div>
            <div class="brokerai-skeleton h-52 rounded-xl"></div>
          </div>

          <div id="posts" class="mt-10 space-y-6"></div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/nav.js"></script>
    <script>
      if (!BrokerAI.requireAuth()) {
        /* redirected */
      }

      function showSkeleton(id) { var el = document.getElementById(id); if(el) el.style.display = ''; }
      function hideSkeleton(id) { var el = document.getElementById(id); if(el) el.style.display = 'none'; }

      var campaignId = null;
      var campaignPending = false;
      var userTimeZone = "UTC";

      function complianceBadgeClass(passed) {
        if (passed === true) return "bg-emerald-100 text-emerald-800 ring-emerald-300";
        if (passed === false) return "bg-red-100 text-red-800 ring-red-300";
        return "bg-amber-100 text-amber-900 ring-amber-300";
      }
      function complianceBadgeText(passed) {
        if (passed === true) return "Compliance: Pass";
        if (passed === false) return "Compliance: Failed";
        return "Compliance: Review";
      }
      function statusBadge(st) {
        var map = {
          published: "bg-emerald-100 text-emerald-800",
          approved: "bg-blue-100 text-blue-800",
          review: "bg-amber-100 text-amber-900",
          draft: "bg-slate-100 text-slate-700",
          failed: "bg-red-100 text-red-800",
          publishing: "bg-sky-100 text-sky-800 animate-pulse",
          pending: "bg-slate-100 text-slate-700",
          pending_approval: "bg-amber-100 text-amber-900",
          publish_failed: "bg-red-100 text-red-800",
        };
        return map[st] || "bg-slate-100 text-slate-700";
      }
      function fmtDate(iso) {
        return BrokerAI.formatScheduleInUserTz(iso, userTimeZone);
      }

      // ── Platform badge + char-count helpers ──────────────────────────────
      var PLATFORM_CHAR_LIMITS = {
        twitter: 280, x: 280,
        instagram: 2200,
        linkedin: 3000,
        facebook: 63206,
        tiktok: 2200,
        pinterest: 500,
        youtube: 5000,
      };
      var PLATFORM_BADGE_STYLES = {
        instagram: { bg: "bg-gradient-to-r from-purple-500 to-pink-500", text: "text-white", icon: "📷" },
        facebook:  { bg: "bg-blue-600",  text: "text-white", icon: "👥" },
        linkedin:  { bg: "bg-sky-700",   text: "text-white", icon: "💼" },
        twitter:   { bg: "bg-slate-900", text: "text-white", icon: "✦" },
        x:         { bg: "bg-slate-900", text: "text-white", icon: "✦" },
        tiktok:    { bg: "bg-black",     text: "text-white", icon: "🎵" },
        youtube:   { bg: "bg-red-600",   text: "text-white", icon: "▶" },
        pinterest: { bg: "bg-red-500",   text: "text-white", icon: "📌" },
      };
      function platformBadgeHtml(platform) {
        var p = (platform || "").toLowerCase().trim();
        var style = PLATFORM_BADGE_STYLES[p] || { bg: "bg-slate-500", text: "text-white", icon: "🌐" };
        var label = p ? (p.charAt(0).toUpperCase() + p.slice(1)) : "Social";
        return '<span class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-bold ' +
          style.bg + ' ' + style.text + '">' +
          '<span aria-hidden="true" class="text-[10px]">' + style.icon + '</span>' +
          label + '</span>';
      }
      function platformCharLimit(platform) {
        var p = (platform || "").toLowerCase().trim();
        return PLATFORM_CHAR_LIMITS[p] || 3000;
      }

      // ── Preview mode ─────────────────────────────────────────────────
      var previewMode = false;

      function renderPreviewCard(post) {
        var caption = (post.caption || post.content || '').substring(0, 300);
        var platform = (post.platform || 'instagram').toLowerCase();
        var supported = ['instagram', 'linkedin', 'twitter', 'facebook'];
        var frameClass = 'device-frame-' + (supported.indexOf(platform) !== -1 ? platform : 'instagram');

        if (platform === 'instagram') {
          return '<div class="' + frameClass + '">' +
            '<div class="df-header"><div class="df-avatar"></div><div><div class="df-name">Your Business</div></div></div>' +
            (post.image_url ? '<img src="' + (post.image_url || '') + '" style="width:100%;aspect-ratio:1;object-fit:cover" alt="">' : '') +
            '<div class="df-caption">' + caption.replace(/</g, '&lt;').replace(/\n/g, '<br>') + '</div>' +
            '<div class="df-footer"><span>&#10084;&#65039; Like</span><span>&#128172; Comment</span><span>&#128228; Share</span></div>' +
            '</div>';
        }
        if (platform === 'linkedin') {
          return '<div class="' + frameClass + '">' +
            '<div class="df-header"><div class="df-avatar"></div><div><div class="df-name">Your Name</div><div class="df-sub">Real Estate Professional</div></div></div>' +
            '<div class="df-caption">' + caption.replace(/</g, '&lt;').replace(/\n/g, '<br>') + '</div>' +
            '<div class="df-footer"><span>&#128077; Like</span><span>&#128172; Comment</span><span>&#8599; Repost</span><span>&#9993;&#65039; Send</span></div>' +
            '</div>';
        }
        if (platform === 'twitter' || platform === 'x') {
          return '<div class="' + frameClass + '">' +
            '<div class="df-header"><div class="df-avatar"></div><div><div class="df-name">Your Business</div><div class="df-handle">@yourbusiness</div></div></div>' +
            '<div class="df-caption">' + caption.replace(/</g, '&lt;').replace(/\n/g, '<br>') + '</div>' +
            '<div class="df-footer"><span>&#128172; Reply</span><span>&#128257; Repost</span><span>&#10084;&#65039; Like</span><span>&#128228; Share</span></div>' +
            '</div>';
        }
        // Default: facebook
        return '<div class="' + frameClass + '">' +
          '<div class="df-header"><div class="df-avatar"></div><div><div class="df-name">Your Page</div><div class="df-sub">Just now &middot; &#127760;</div></div></div>' +
          '<div class="df-caption">' + caption.replace(/</g, '&lt;').replace(/\n/g, '<br>') + '</div>' +
          '<div class="df-footer"><span>&#128077; Like</span><span>&#128172; Comment</span><span>&#8599; Share</span></div>' +
          '</div>';
      }

      // ─────────────────────────────────────────────────────────────────

      function render(data) {
        window.__lastRenderData = data;
        var camp = data.campaign;
        campaignId = camp.id;
        campaignPending = camp.status === "pending_approval";
        var meta = document.getElementById("campaign-meta");
        meta.textContent = "Campaign #" + camp.id + " · " + camp.status.replace(/_/g, " ");

        var btn = document.getElementById("approve-campaign-btn");
        var wrap = document.getElementById("approve-wrap");
        var pending = camp.status === "pending_approval";
        btn.disabled = !pending;
        btn.textContent = pending
          ? "Approve & schedule"
          : camp.status === "completed"
            ? "Campaign approved"
            : camp.status.replace(/_/g, " ");
        wrap.classList.toggle("opacity-60", !pending);

        var posts = data.posts || [];
        document.getElementById("stat-total").textContent = posts.length;
        document.getElementById("stat-compliant").textContent = posts.filter(function (p) {
          return p.compliance_passed === true;
        }).length;
        document.getElementById("stat-images").textContent = posts.filter(function (p) {
          return !!safeImageUrl(p.image_url);
        }).length;
        document.getElementById("stat-platforms").textContent = posts.length ? "Active" : "-";

        // Draft-mode banner: show when campaign has no social accounts connected
        var draftBanner = document.getElementById("draft-mode-banner");
        if (camp.status === "draft") {
          if (!draftBanner) {
            draftBanner = document.createElement("div");
            draftBanner.id = "draft-mode-banner";
            draftBanner.style.cssText = "background:#FEF3C7;color:#92400E;padding:12px 16px;border-radius:8px;margin-bottom:16px;";
            draftBanner.innerHTML = '\u26A0\uFE0F Connect your social accounts to publish this campaign. <a href="/connect.html" style="font-weight:600;text-decoration:underline;">Connect accounts \u2192</a>';
            var postsEl = document.getElementById("posts");
            postsEl.parentNode.insertBefore(draftBanner, postsEl);
          }
          draftBanner.style.display = "";
        } else if (draftBanner) {
          draftBanner.style.display = "none";
        }

        var root = document.getElementById("posts");
        root.innerHTML = "";
        if (!posts.length) {
          root.innerHTML =
            '<div class="brokerai-empty">' +
              '<div class="text-3xl mb-2">📝</div>' +
              '<h3 class="text-base font-semibold text-slate-800">No posts in this campaign yet</h3>' +
              '<p class="mt-1 text-sm text-slate-500">Generate content with AI or build posts manually to get started.</p>' +
              '<a href="/wizard.html" class="mt-4 inline-flex items-center gap-2 rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 px-4 py-2 text-sm font-bold text-white shadow-md shadow-amber-500/25 transition hover:scale-[1.02]">✨ Run the wizard</a>' +
            '</div>';
          return;
        }

        function escVideoAttr(s) {
          return String(s || "")
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;");
        }

        /** Escape a string for use inside double-quoted HTML attributes (e.g. img src). */
        function escAttr(s) {
          return escVideoAttr(s);
        }

        function safeImageUrl(u) {
          var s = String(u || "").trim();
          if (s.length < 6) return "";
          if (/^https?:\/\//i.test(s) || s.charAt(0) === "/") return s;
          return "";
        }

        function resolvePostVideoUrl(p) {
          var u = (p && p.video_url && String(p.video_url).trim()) || "";
          if (u.length > 4 && /^https?:\/\//i.test(u)) return u;
          if (u.length > 1 && u.charAt(0) === "/") {
            try {
              return (window.location.origin || "") + u;
            } catch (_e) {
              return u;
            }
          }
          var raw = (p && p.video_script && String(p.video_script).trim()) || "";
          if (!raw) return "";
          try {
            var o = JSON.parse(raw);
            if (o && typeof o === "object" && !Array.isArray(o)) {
              var keys = ["video_url", "wizard_external_video_url", "url", "src"];
              for (var ki = 0; ki < keys.length; ki++) {
                var c = o[keys[ki]];
                if (c && String(c).trim().length > 4) {
                  var s2 = String(c).trim();
                  if (/^https?:\/\//i.test(s2)) return s2;
                  if (s2.charAt(0) === "/") {
                    try {
                      return (window.location.origin || "") + s2;
                    } catch (_e2) {
                      return s2;
                    }
                  }
                }
              }
            }
          } catch (_pe) {}
          return "";
        }

        function isVideoOnlyScriptObj(o) {
          if (!o || typeof o !== "object" || Array.isArray(o)) return false;
          var allowed = {
            video_url: 1,
            wizard_external_video_url: 1,
            source: 1,
            kind: 1,
            url: 1,
            src: 1,
          };
          var k = Object.keys(o);
          if (!k.length) return false;
          for (var i = 0; i < k.length; i++) {
            if (!allowed[k[i]]) return false;
          }
          return true;
        }

        function hasRenderableScriptObj(vsObj) {
          if (!vsObj || typeof vsObj !== "object" || Array.isArray(vsObj)) return false;
          if (isVideoOnlyScriptObj(vsObj)) return false;
          if (String(vsObj.hook || "").trim()) return true;
          if (String(vsObj.voiceover || "").trim()) return true;
          if (String(vsObj.cta || "").trim()) return true;
          if (Array.isArray(vsObj.scenes)) {
            for (var si = 0; si < vsObj.scenes.length; si++) {
              if (String(vsObj.scenes[si] || "").trim()) return true;
            }
          }
          return false;
        }

        // ── Preview mode: render platform device frames ───────────────
        if (previewMode) {
          var grid = document.createElement("div");
          grid.className = "grid gap-6 sm:grid-cols-2 xl:grid-cols-3";
          posts.forEach(function (p) {
            var wrapper = document.createElement("div");
            wrapper.className = "flex flex-col gap-2";
            // platform label row
            var labelRow = '<div class="flex items-center justify-between px-1">' +
              platformBadgeHtml(p.platform) +
              (p.day ? '<span class="text-xs font-bold text-amber-600">' + p.day + '</span>' : '') +
              '</div>';
            wrapper.innerHTML = labelRow + renderPreviewCard(p);
            grid.appendChild(wrapper);
          });
          root.appendChild(grid);
          return;
        }
        // ── Edit mode (default) ───────────────────────────────────────

        posts.forEach(function (p, idx) {
          var card = document.createElement("article");
          card.className =
            "overflow-hidden rounded-2xl border border-slate-200/80 bg-white/90 shadow-lg backdrop-blur-md transition duration-300 hover:shadow-2xl";
          card.id = "post-card-" + p.id;

          var postPending =
            campaignPending &&
            (p.status === "review" ||

          var postApproved =

          body +=

            '<button type="button" class="regen-btn inline-flex items-center rounded-lg border border-amber-200 bg-amber-50 px-3 py-1.5 text-xs font-semibold text-amber-800 shadow-sm transition hover:scale-105 active:scale-95" onclick="regeneratePost(' + p.id + ', document.getElementById(\'post-card-' + p.id + '\'))">&#x1F504; Regenerate</button>' +
            '<button type="button" id="save-lib-btn-' + p.id + '" onclick="openSaveToLibrary(' + p.id + ',\'' + (p.platform || 'instagram').toLowerCase().replace(/'/g,'') + '\')" class="inline-flex items-center rounded-lg border border-slate-200 bg-white px-2 py-1 text-xs font-medium text-slate-600 shadow-sm transition hover:scale-105 active:scale-95">&#x1F4DA; Save to Library</button>' +
            '</div>';
          body += "</div>";

          // S5-02: A/B caption toggle bar — only shown when variant B exists
          if (p.ab_variant_b) {
            var abWinner = p.ab_winner || null;
            var abStatus = p.ab_status || "testing";
            var abWinnerLabel = abWinner ? (' &nbsp;<span class="font-semibold text-emerald-700">Winner: Variant ' + abWinner.toUpperCase() + '</span>') : '';
            body +=
              '<div id="ab-bar-' + p.id + '" class="mt-3 rounded-xl border border-indigo-200 bg-indigo-50/60 px-3 py-2">' +
              '<div class="mb-1.5 flex items-center gap-2">' +
              '<span class="text-[11px] font-bold uppercase tracking-wide text-indigo-700">A/B Test</span>' +
              '<span class="rounded-full bg-indigo-100 px-2 py-0.5 text-[10px] font-semibold text-indigo-600">' + abStatus + '</span>' +
              abWinnerLabel +
              '</div>' +
              '<div class="flex flex-wrap gap-1.5">' +
              '<button type="button" onclick="showABVariant(' + p.id + ', \'a\')" id="ab-btn-view-a-' + p.id + '" class="rounded-lg border border-indigo-300 bg-white px-2.5 py-1 text-xs font-semibold text-indigo-700 shadow-sm transition hover:scale-105 active:scale-95">Variant A</button>' +
              '<button type="button" onclick="showABVariant(' + p.id + ', \'b\')" id="ab-btn-view-b-' + p.id + '" class="rounded-lg border border-indigo-300 bg-white px-2.5 py-1 text-xs font-semibold text-indigo-700 shadow-sm transition hover:scale-105 active:scale-95">Variant B</button>' +
              '<button type="button" onclick="selectABWinner(' + p.id + ', \'a\')" class="rounded-lg bg-emerald-500 px-2.5 py-1 text-xs font-bold text-white shadow-sm transition hover:scale-105 active:scale-95">&#10003; Use A</button>' +
              '<button type="button" onclick="selectABWinner(' + p.id + ', \'b\')" class="rounded-lg bg-emerald-600 px-2.5 py-1 text-xs font-bold text-white shadow-sm transition hover:scale-105 active:scale-95">&#10003; Use B</button>' +
              '</div></div>';
          }

          body += '<div id="caption-edit-' + p.id + '" class="hidden space-y-2">';
          var charLimit = platformCharLimit(p.platform);
          var initLen = (p.caption || "").length;
          var initRemain = charLimit - initLen;
          var initCountClass = initRemain < 0 ? "text-xs font-semibold text-red-600" : initRemain < 50 ? "text-xs font-semibold text-amber-600" : "text-xs text-slate-400";
          body +=
            '<textarea id="caption-textarea-' +
            p.id +
            '" rows="5" oninput="updateCharCount(' + p.id + ',' + charLimit + ')" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 shadow-inner focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-500/20">' +
            (p.caption || "").replace(/</g, "&lt;") +
            "</textarea>";
          body += '<div class="flex items-center justify-between gap-3">';
          body += '<span id="char-count-' + p.id + '" class="' + initCountClass + '">' + initLen + '\u00a0/\u00a0' + charLimit + '\u00a0chars</span>';
          body += '<div class="flex flex-wrap gap-2">';
          body +=
            '<button type="button" onclick="saveEdit(' +
            p.id +
            ')" class="rounded-lg bg-amber-500 px-4 py-2 text-xs font-semibold text-white shadow-md transition hover:scale-105 active:scale-95">Save</button>';
          body +=
            '<button type="button" onclick="cancelEdit(' +

          body += "</div></div></div>";

          body += '<div class="flex flex-wrap gap-1.5">';
          (p.hashtags || []).forEach(function (tag) {
            body +=
              '<span class="rounded-md bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-600">' +

              "</span>";

          body += "</div>";

          var vUrl = resolvePostVideoUrl(p);
          if (vUrl && (/^https?:\/\//i.test(vUrl) || vUrl.indexOf("/wizard-video-serve") !== -1)) {
            body +=
              '<div class="mx-auto w-full max-w-3xl overflow-hidden rounded-xl border border-slate-200 bg-slate-950 shadow-inner">' +
              '<p class="border-b border-slate-800/80 px-3 py-2 text-[11px] font-semibold uppercase tracking-wide text-slate-300">Video</p>' +
              '<div class="relative aspect-video w-full min-h-[300px] max-h-[min(72vh,720px)] bg-black">';
            var vLower = vUrl.toLowerCase();
            var looksLikeDirectMp4 =
              vLower.indexOf("wizard-video-serve") !== -1 || /\.mp4(\?|#|$)/i.test(vUrl);
            if (looksLikeDirectMp4) {
              body +=
                '<video src="' +
                escVideoAttr(vUrl) +
                '" class="h-full w-full object-contain" controls playsinline preload="metadata"></video>';
            } else {
              body +=
                '<iframe class="aspect-video h-full min-h-[300px] w-full border-0 bg-black" src="' +
                escVideoAttr(vUrl) +
                '" title="Campaign video" allow="autoplay; fullscreen; encrypted-media" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>';
            }
            body += "</div></div>";
          }

          if (p.compliance_passed === false && p.compliance_issues && p.compliance_issues.length) {
            body +=
              '<div class="rounded-xl border border-red-200 bg-red-50/80 px-3 py-2 text-xs text-red-900">';
            body += '<p class="mb-1 font-semibold">Compliance issues</p><ul class="list-inside list-disc space-y-0.5 opacity-90">';
            p.compliance_issues.forEach(function (issue) {
              body += "<li>" + issue.replace(/</g, "&lt;") + "</li>";
            });
            body += "</ul></div>";
          }

          if (p.video_script && !vUrl) {
            var vsRaw = (p.video_script || "").trim();
            var vsObj = null;
            try {
              vsObj = JSON.parse(vsRaw);
            } catch (e) {
              vsObj = null;
            }
            if (vsObj && typeof vsObj === "object" && !Array.isArray(vsObj) && isVideoOnlyScriptObj(vsObj)) {
              var rawPlay =
                String(vsObj.video_url || vsObj.wizard_external_video_url || vsObj.url || vsObj.src || "").trim();
              var metaUrl = rawPlay;
              if (metaUrl && metaUrl.charAt(0) === "/") {
                try {
                  metaUrl = (window.location.origin || "") + metaUrl;
                } catch (_e3) {
                  /* keep relative */
                }
              }
              var metaNote =
                '<p class="text-xs text-slate-600">A campaign video attachment is stored for this post (wizard preview or generated reel).</p>' +
                (metaUrl && (/^https?:\/\//i.test(metaUrl) || metaUrl.indexOf("/wizard-video-serve") !== -1)
                  ? '<p class="mt-2 text-xs"><a class="font-semibold text-amber-700 hover:underline" href="' +
                    escAttr(metaUrl) +
                    '" target="_blank" rel="noopener noreferrer">Open video</a></p>'
                  : "");
              body +=
                '<details class="group mt-3 rounded-xl border border-slate-200 bg-slate-50/80 open:bg-white open:shadow-sm">' +
                '<summary class="cursor-pointer list-none px-3 py-2 text-xs font-semibold text-amber-700 marker:hidden [&::-webkit-details-marker]:hidden">Video attachment <span class="text-slate-400 group-open:hidden">· tap to expand</span></summary>' +
                '<div class="border-t border-slate-100 p-3">' +
                metaNote +
                "</div></details>";
            } else if (hasRenderableScriptObj(vsObj)) {
              var vsBlock =
                '<div class="space-y-2 text-xs text-slate-700">' +
                (String(vsObj.hook || "").trim()
                  ? '<p><span class="font-semibold text-slate-900">Hook:</span> ' +
                    String(vsObj.hook).replace(/</g, "&lt;") +
                    "</p>"
                  : "") +
                (Array.isArray(vsObj.scenes) && vsObj.scenes.some(function (s) { return String(s || "").trim(); })
                  ? "<div><span class=\"font-semibold text-slate-900\">Scenes:</span><ol class=\"mt-1 list-decimal pl-4\">" +
                    vsObj.scenes
                      .map(function (s) {
                        var t = String(s || "").trim();
                        return t ? "<li>" + t.replace(/</g, "&lt;") + "</li>" : "";
                      })
                      .join("") +
                    "</ol></div>"
                  : "") +
                (String(vsObj.voiceover || "").trim()
                  ? '<p><span class="font-semibold text-slate-900">Voiceover:</span> ' +
                    String(vsObj.voiceover).replace(/</g, "&lt;") +
                    "</p>"
                  : "") +
                (String(vsObj.cta || "").trim()
                  ? '<p><span class="font-semibold text-slate-900">CTA:</span> ' +
                    String(vsObj.cta).replace(/</g, "&lt;") +
                    "</p>"
                  : "") +
                "</div>";
              if (vsBlock.replace(/<[^>]+>/g, "").trim()) {
                body +=
                  '<details class="group rounded-xl border border-slate-200 bg-slate-50/80 open:bg-white open:shadow-sm">';
                body +=
                  '<summary class="cursor-pointer list-none px-3 py-2 text-xs font-semibold text-amber-700 marker:hidden [&::-webkit-details-marker]:hidden">AI video script <span class="text-slate-400 group-open:hidden">· tap to expand</span></summary>';
                body += '<div class="border-t border-slate-100 p-3">' + vsBlock + "</div>";
                body += "</details>";
              }
            } else if (!vsObj && vsRaw) {
              var vsPlain =
                '<pre class="max-h-48 overflow-auto whitespace-pre-wrap text-xs leading-relaxed text-slate-700">' +
                vsRaw.replace(/</g, "&lt;") +
                "</pre>";
              if (vsRaw.replace(/\s/g, "").length) {
                body +=
                  '<details class="group rounded-xl border border-slate-200 bg-slate-50/80 open:bg-white open:shadow-sm">';
                body +=
                  '<summary class="cursor-pointer list-none px-3 py-2 text-xs font-semibold text-amber-700 marker:hidden [&::-webkit-details-marker]:hidden">AI video script <span class="text-slate-400 group-open:hidden">· tap to expand</span></summary>';
                body += '<div class="border-t border-slate-100 p-3">' + vsPlain + "</div>";
                body += "</details>";
              }
            }
          }

          body += '<div class="flex flex-wrap items-center gap-4 border-t border-slate-100 pt-4">';
          body += '<span class="text-xs font-medium text-slate-500">Post approve</span>';
          body += '<label class="inline-flex cursor-pointer items-center gap-2">';
          body +=
            '<input type="checkbox" class="peer sr-only" data-post-approve="' +
            p.id +
            '" ' +
            (postApproved ? "checked disabled" : postPending ? "" : "disabled") +
            " />";
          body +=
            '<span class="relative h-7 w-12 rounded-full bg-slate-200 transition peer-checked:bg-emerald-500 peer-disabled:opacity-50 after:absolute after:left-1 after:top-1 after:h-5 after:w-5 after:rounded-full after:bg-white after:shadow after:transition peer-checked:after:translate-x-5"></span>';
          body += "</label>";
          body +=
            '<span class="text-[11px] text-slate-400">Use per-post approve or the campaign button above.</span>';
          body += "</div>";

          if (showPublishNow) {
            body += '<div class="mt-4 rounded-xl border border-violet-200/80 bg-violet-50/40 px-4 py-3">';
            body += '<p class="text-xs font-semibold text-violet-900">Publish to social</p>';
            body +=
              '<p class="mt-0.5 text-[11px] text-violet-800/80">Bypass schedule and send now (idempotent).</p>';
            if (p.status === "publishing") {
              body +=
                '<p class="mt-2 flex items-center gap-2 text-xs font-medium text-sky-700"><span class="brokerai-spinner h-4 w-4 shrink-0" aria-hidden="true"></span> Publishing…</p>';
            }
            if (p.last_error && p.status === "failed") {
              body +=
                '<p class="mt-2 rounded-lg border border-red-200 bg-red-50/90 px-2 py-1.5 text-[11px] text-red-900">' +
                String(p.last_error).replace(/</g, "&lt;") +
                "</p>";
            }
            // RBAC: only show publish button to owner/admin
            if (!window.__rbac_is_member) {
              body +=
                '<button type="button" data-publish-now="' +
                p.id +
                '" ' +
                (publishNowDisabled ? "disabled" : "") +
                ' class="mt-2 rounded-lg bg-violet-600 px-4 py-2 text-xs font-bold text-white shadow-sm transition hover:bg-violet-700 disabled:cursor-not-allowed disabled:opacity-40">Publish now</button>';
            }
            body += "</div>";
          }

          body += "</div></div>";
          card.innerHTML = head + body;
          root.appendChild(card);

          // S5-02: Register A/B variant texts for this post so showABVariant() can access them
          if (p.ab_variant_b) {
            _storeABVariants(p.id, p.caption || "", p.ab_variant_b);
          }

          var pubBtn = card.querySelector('[data-publish-now="' + p.id + '"]');
          if (pubBtn && !pubBtn.disabled) {
            pubBtn.addEventListener("click", async function () {
              pubBtn.disabled = true;
              try {
                await BrokerAI.apiJson("/publish/" + p.id, { method: "POST", body: "{}" });
                BrokerAI.showToast("Publish completed", "success");
                load();
              } catch (err) {
                BrokerAI.showToast(err.message || "Publish failed", "error");
                pubBtn.disabled = false;
              }
            });
          }

          var toggle = card.querySelector('[data-post-approve="' + p.id + '"]');
          if (toggle && !toggle.disabled && postPending) {
            toggle.addEventListener("change", async function () {
              if (!this.checked) return;
              try {
                await BrokerAI.apiJson("/approve-post/" + p.id, { method: "POST" });
                BrokerAI.showToast("Post approved", "success");
                load();
              } catch (err) {
                BrokerAI.showToast(err.message, "error");
                this.checked = false;
              }
            });
          }
        });
      }

      // ── Save to Library ───────────────────────────────────────────────────
      function openSaveToLibrary(postId, platform) {
        // Get current caption from the display or textarea
        var taEl = document.getElementById("caption-textarea-" + postId);
        var dispEl = document.getElementById("caption-display-" + postId);
        var content = "";
        if (taEl) {
          content = taEl.value;
        }
        if (!content && dispEl) {
          // Strip HTML tags from displayed text
          var tmp = document.createElement("div");
          tmp.innerHTML = dispEl.querySelector(".max-w-none") ? dispEl.querySelector(".max-w-none").innerHTML : "";
          content = tmp.textContent || tmp.innerText || "";
        }

        // Remove existing modal if any
        var existingModal = document.getElementById("save-lib-modal");
        if (existingModal) existingModal.remove();

        var overlay = document.createElement("div");
        overlay.id = "save-lib-modal";
        overlay.className = "fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4";
        overlay.innerHTML = '<div class="w-full max-w-md rounded-2xl bg-white shadow-2xl border border-slate-200 p-6">' +
          '<div class="mb-4 flex items-center justify-between">' +
            '<h3 class="text-base font-bold text-slate-900">&#x1F4DA; Save to Library</h3>' +
            '<button id="save-lib-close" class="rounded-md px-2 py-1 text-slate-500 hover:bg-slate-100 text-sm">&#x2715;</button>' +
          '</div>' +
          '<div class="space-y-3">' +
            '<div>' +
              '<label class="mb-1 block text-xs font-semibold text-slate-600">Label</label>' +
              '<input id="save-lib-label" type="text" placeholder="e.g. Open House Caption" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-amber-400 focus:outline-none" />' +
            '</div>' +
            '<div class="grid grid-cols-2 gap-3">' +
              '<div>' +
                '<label class="mb-1 block text-xs font-semibold text-slate-600">Platform</label>' +
                '<input id="save-lib-platform" type="text" value="' + (platform || "instagram") + '" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-amber-400 focus:outline-none" />' +
              '</div>' +
              '<div>' +
                '<label class="mb-1 block text-xs font-semibold text-slate-600">Kind</label>' +
                '<input type="text" value="caption" disabled class="w-full rounded-lg border border-slate-100 bg-slate-50 px-3 py-2 text-sm text-slate-500 cursor-not-allowed" />' +
              '</div>' +
            '</div>' +
            '<div>' +
              '<label class="mb-1 block text-xs font-semibold text-slate-600">Tags <span class="font-normal text-slate-400">(comma-separated)</span></label>' +
              '<input id="save-lib-tags" type="text" placeholder="e.g. open-house, listing, spring" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-amber-400 focus:outline-none" />' +
            '</div>' +
            '<div class="rounded-lg border border-slate-100 bg-slate-50 px-3 py-2">' +
              '<p class="text-[11px] font-semibold text-slate-500 mb-1">Content preview</p>' +
              '<p id="save-lib-preview" class="text-xs text-slate-700 line-clamp-3 whitespace-pre-wrap max-h-16 overflow-hidden"></p>' +
            '</div>' +
          '</div>' +
          '<div class="mt-5 flex justify-end gap-2">' +
            '<button id="save-lib-cancel" class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-50">Cancel</button>' +
            '<button id="save-lib-submit" class="rounded-lg bg-amber-500 px-4 py-2 text-xs font-bold text-white shadow-sm transition hover:bg-amber-600 disabled:opacity-50">Save</button>' +
          '</div>' +
        '</div>';
        document.body.appendChild(overlay);

        // Populate preview
        var prevEl = document.getElementById("save-lib-preview");
        if (prevEl) prevEl.textContent = content;

        function closeModal() { overlay.remove(); }
        document.getElementById("save-lib-close").addEventListener("click", closeModal);
        document.getElementById("save-lib-cancel").addEventListener("click", closeModal);
        overlay.addEventListener("click", function(e) { if (e.target === overlay) closeModal(); });

        document.getElementById("save-lib-submit").addEventListener("click", async function() {
          var label = (document.getElementById("save-lib-label").value || "").trim();
          if (!label) { document.getElementById("save-lib-label").focus(); return; }
          var platVal = (document.getElementById("save-lib-platform").value || "").trim().toLowerCase();
          var tagsRaw = (document.getElementById("save-lib-tags").value || "").trim();
          var tags = tagsRaw ? tagsRaw.split(",").map(function(s){ return s.trim(); }).filter(Boolean) : [];

          var btn = this;
          btn.disabled = true;
          btn.textContent = "Saving…";

          try {
            await BrokerAI.apiJson("/content-library", {
              method: "POST",
              body: JSON.stringify({ kind: "caption", content: content, label: label, platform: platVal, tags: tags })
            });
            closeModal();
            // Flash success on the trigger button
            var triggerBtn = document.getElementById("save-lib-btn-" + postId);
            if (triggerBtn) {
              var origText = triggerBtn.innerHTML;
              triggerBtn.innerHTML = "&#x2705; Saved!";
              triggerBtn.disabled = true;
              setTimeout(function() {
                triggerBtn.innerHTML = origText;
                triggerBtn.disabled = false;
              }, 2000);
            }
          } catch (err) {
            alert("Failed to save: " + (err.message || "Unknown error"));
            btn.disabled = false;
            btn.textContent = "Save";
          }
        });
      }
      // ─────────────────────────────────────────────────────────────────────

      // ── S5-02: A/B caption testing helpers ───────────────────────────────
      // Store variant texts for each post so we can switch between them
      var _abVariants = {};

      function _storeABVariants(postId, variantA, variantB) {
        _abVariants[postId] = { a: variantA, b: variantB };
      }

      function showABVariant(postId, variant) {
        var vMap = _abVariants[postId];
        if (!vMap) return;
        var text = variant === "b" ? (vMap.b || "") : (vMap.a || "");
        var dispEl = document.getElementById("caption-display-" + postId);
        if (!dispEl) return;
        var innerDiv = dispEl.querySelector(".max-w-none");
        if (!innerDiv) return;
        try {
          innerDiv.innerHTML = typeof marked !== "undefined"
            ? marked.parse(text)
            : text.replace(/\n/g, "<br/>");
        } catch (_e) {
          innerDiv.textContent = text;
        }
        // Highlight active button
        var btnA = document.getElementById("ab-btn-view-a-" + postId);
        var btnB = document.getElementById("ab-btn-view-b-" + postId);
        if (btnA) btnA.className = btnA.className.replace("bg-white", variant === "a" ? "bg-indigo-100" : "bg-white");
        if (btnB) btnB.className = btnB.className.replace("bg-white", variant === "b" ? "bg-indigo-100" : "bg-white");
      }

      async function selectABWinner(postId, winner) {
        try {
          await BrokerAI.apiJson("/posts/" + postId + "/ab-select", {
            method: "POST",
            body: JSON.stringify({ winner: winner }),
          });
          BrokerAI.showToast("Variant " + winner.toUpperCase() + " selected as winner", "success");
          load();
        } catch (err) {
          BrokerAI.showToast(err.message || "Failed to select winner", "error");
        }
      }
      // ─────────────────────────────────────────────────────────────────────

      function startEdit(postId) {
        document.getElementById("caption-display-" + postId).classList.add("hidden");
        document.getElementById("caption-edit-" + postId).classList.remove("hidden");
        var ta = document.getElementById("caption-textarea-" + postId);
        if (ta) {
          ta.focus();
          // Sync char count on open (content may have been updated by a prior save)
          var el = document.getElementById("char-count-" + postId);
          if (el) {
            var m = el.textContent.match(/\/\s*([\d,]+)/);
            var lim = m ? parseInt(m[1].replace(/,/g, "")) : 3000;
            updateCharCount(postId, lim);
          }
        }
      }
      function cancelEdit(postId) {
        document.getElementById("caption-display-" + postId).classList.remove("hidden");
        document.getElementById("caption-edit-" + postId).classList.add("hidden");
      }
      function updateCharCount(postId, limit) {
        var ta = document.getElementById("caption-textarea-" + postId);
        var el = document.getElementById("char-count-" + postId);
        if (!ta || !el) return;
        var len = ta.value.length;
        var remaining = limit - len;
        el.textContent = len + "\u00a0/\u00a0" + limit + "\u00a0chars";
        if (remaining < 0) {
          el.className = "text-xs font-semibold text-red-600";
        } else if (remaining < 50) {
          el.className = "text-xs font-semibold text-amber-600";
        } else {
          el.className = "text-xs text-slate-400";
        }
      }
      async function saveEdit(postId) {
        var newCaption = document.getElementById("caption-textarea-" + postId).value;
        try {
          await BrokerAI.apiJson("/update-post/" + postId, {
            method: "POST",
            body: JSON.stringify({ caption: newCaption }),
          });
          BrokerAI.showToast("Caption updated", "success");
          load();
        } catch (err) {
          BrokerAI.showToast(err.message, "error");
        }
      }

      async function regeneratePost(postId, cardEl) {
        var btn = cardEl.querySelector('.regen-btn');
        btn.disabled = true;
        btn.textContent = '\u23F3 Regenerating...';
        try {
          var res = await fetch('/posts/' + postId + '/regenerate', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('brokerai_token') || localStorage.getItem('token') || '') }
          });
          if (!res.ok) throw new Error(await res.text());
          var data = await res.json();
          // Update caption display
          var dispEl = document.getElementById('caption-display-' + postId);
          if (dispEl) {
            var innerDiv = dispEl.querySelector('.max-w-none');
            if (innerDiv) {
              try {
                innerDiv.innerHTML = typeof marked !== 'undefined'
                  ? marked.parse(data.content || '')
                  : (data.content || '').replace(/\n/g, '<br/>');
              } catch (_e) {
                innerDiv.textContent = data.content || '';
              }
            }
          }
          // Update textarea if edit mode is open
          var contentEl = cardEl.querySelector('.post-content-text');
          if (contentEl) contentEl.value = data.content;
          var taEl = document.getElementById('caption-textarea-' + postId);
          if (taEl) taEl.value = data.content || '';
          var promptEl = cardEl.querySelector('.post-media-prompt');
          if (promptEl) promptEl.value = data.media_prompt || '';
          BrokerAI.showToast('Post regenerated \u2713', 'success');
        } catch (e) {
          BrokerAI.showToast('Regeneration failed \u2014 try again', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = '\uD83D\uDD04 Regenerate';
        }
      }

      async function load() {
        var q = new URLSearchParams(location.search).get("campaign");
        var id = q || sessionStorage.getItem("brokerai_campaign_id");
        var root = document.getElementById("posts");
        if (!id) {
          root.innerHTML =
            '<p class="text-slate-600">Open from the wizard or add <code class="rounded bg-slate-100 px-1 text-amber-700">?campaign=ID</code> to the URL.</p>';
          document.getElementById("approve-campaign-btn").disabled = true;
          hideSkeleton('review-skeleton');
          return;
        }
        showSkeleton('review-skeleton');
        root.innerHTML = "";
        BrokerAI.setLoading(true);
        try {
          var me = await BrokerAI.apiJson("/me", { method: "GET" });
          userTimeZone = (me && me.timezone) || "UTC";

          // RBAC: hide approve/publish controls for team/org members
          var userRole = (me && me.role) || "owner";
          var userAccountType = (me && me.account_type) || "individual";
          var isMember = (userAccountType !== "individual") && (userRole === "member");
          if (isMember) {
            var approveWrap = document.getElementById("approve-wrap");
            if (approveWrap) {
              approveWrap.innerHTML =
                '<div class="rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-sm text-amber-900">' +
                '<strong>Team member:</strong> Campaign approval requires an owner or admin.' +
                '</div>';
            }
            // Hide per-post publish/approve buttons (rendered dynamically via render())
            window.__rbac_is_member = true;
          } else {
            window.__rbac_is_member = false;
          }

          var data = await BrokerAI.apiJson("/campaigns/" + encodeURIComponent(id), { method: "GET" });
          hideSkeleton('review-skeleton');
          render(data);
        } catch (err) {
          hideSkeleton('review-skeleton');
          BrokerAI.showToast(err.message, "error");
        } finally {
          BrokerAI.setLoading(false);
        }
      }

      document.getElementById("approve-campaign-btn").addEventListener("click", async function () {
        if (!campaignId) return;
        var btn = this;
        btn.disabled = true;
        document.getElementById("publish-overlay").classList.remove("hidden");
        try {
          await BrokerAI.apiJson("/approve-campaign", {
            method: "POST",
            body: JSON.stringify({ campaign_id: campaignId }),
          });
          BrokerAI.showToast("Campaign approved — posts are scheduled.", "success");
          await load();
        } catch (err) {
          BrokerAI.showToast(err.message, "error");
          btn.disabled = false;
        } finally {
          document.getElementById("publish-overlay").classList.add("hidden");
        }
      });

      load();
    </script>

    <!-- jsPDF — campaign PDF report (S5-10) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script>
      // ── Campaign Performance Report (S5-10) ──────────────────────────────
      function downloadCampaignReport() {
        // campaignId is the page-level variable set by render()
        var cid  = (typeof campaignId !== 'undefined') ? campaignId : null;
        var meta = document.getElementById('campaign-meta');
        var name = meta ? meta.textContent.split('\u00b7')[0].trim() : ('Campaign ' + cid);
        generateCampaignReport(cid, name);
      }

      async function generateCampaignReport(campaignId, campaignName) {
        if (!campaignId) { alert('No campaign loaded yet.'); return; }
        if (typeof window.jspdf === 'undefined' && typeof jspdf === 'undefined') {
          alert('PDF library not loaded. Please refresh and try again.');
          return;
        }

        var token = localStorage.getItem('brokerai_token') || localStorage.getItem('token') || '';
        if (!token) { alert('Please log in first.'); return; }

        // Progress toast
        var toast = document.createElement('div');
        toast.id = 'report-toast';
        toast.textContent = 'Generating report\u2026';
        toast.style.cssText =
          'position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);' +
          'background:#f59e0b;color:#fff;font-size:0.85rem;font-weight:600;' +
          'padding:0.55rem 1.25rem;border-radius:999px;' +
          'box-shadow:0 4px 16px rgba(0,0,0,0.18);z-index:9999;pointer-events:none;';
        document.body.appendChild(toast);

        try {
          var res = await fetch('/campaigns/' + encodeURIComponent(campaignId) + '/report/pdf', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + token },
          });
          if (!res.ok) {
            var err = await res.json().catch(function () { return {}; });
            throw new Error((err && err.detail) || 'Failed to load report data');
          }
          var data = await res.json();

          var _jspdf = window.jspdf || window;
          var jsPDF = (_jspdf.jspdf || _jspdf).jsPDF;
          var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

          var pageW = doc.internal.pageSize.width;
          var pageH = doc.internal.pageSize.height;
          var AMBER = [245, 158, 11];
          var SLATE  = [30, 41, 59];
          var WHITE  = [255, 255, 255];
          var LIGHT  = [248, 250, 252];
          var margin = 14;

          function addFooter() {
            var pages = doc.internal.getNumberOfPages();
            for (var i = 1; i <= pages; i++) {
              doc.setPage(i);
              doc.setDrawColor(226, 232, 240);
              doc.line(margin, pageH - 10, pageW - margin, pageH - 10);
              doc.setFontSize(7);
              doc.setTextColor(148, 163, 184);
              doc.setFont('helvetica', 'normal');
              doc.text(
                'Generated by BrokerAI \u2022 Confidential \u2022 Page ' + i + ' of ' + pages,
                pageW / 2, pageH - 5, { align: 'center' }
              );
            }
          }

          // Cover band
          doc.setFillColor(AMBER[0], AMBER[1], AMBER[2]);
          doc.rect(0, 0, pageW, 30, 'F');
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(22);
          doc.setTextColor(WHITE[0], WHITE[1], WHITE[2]);
          doc.text('BrokerAI', margin, 18);
          doc.setFontSize(10);
          doc.setFont('helvetica', 'normal');
          doc.text('AI-Powered Social Media Campaigns', margin, 25);

          var curY = 44;

          // Campaign name
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(18);
          doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]);
          var nameLines = doc.splitTextToSize(data.campaign.name || 'Campaign Report', pageW - margin * 2);
          doc.text(nameLines, margin, curY);
          curY += nameLines.length * 7 + 2;

          doc.setFont('helvetica', 'normal');
          doc.setFontSize(10);
          doc.setTextColor(100, 116, 139);
          var genDate = data.generated_at
            ? new Date(data.generated_at + 'Z').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
            : new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
          doc.text('Campaign Performance Report  \u2022  Generated: ' + genDate, margin, curY);
          curY += 6;

          doc.setDrawColor(AMBER[0], AMBER[1], AMBER[2]);
          doc.setLineWidth(0.6);
          doc.line(margin, curY, pageW - margin, curY);
          curY += 8;

          // Campaign details table
          doc.autoTable({
            startY: curY,
            head: [['Campaign Details', '']],
            body: [
              ['Name',            data.campaign.name          || '\u2014'],
              ['Objective',       data.campaign.objective     || '\u2014'],
              ['Target Audience', data.campaign.target_audience || '\u2014'],
              ['Status',          (data.campaign.status || '').replace(/_/g, ' ')],
              ['Created',         data.campaign.created_at
                ? new Date(data.campaign.created_at + 'Z').toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
                : '\u2014'],
            ],
            headStyles: { fillColor: AMBER, textColor: SLATE, fontStyle: 'bold', fontSize: 9 },
            bodyStyles: { fontSize: 9, cellPadding: 3 },
            alternateRowStyles: { fillColor: LIGHT },
            columnStyles: { 0: { cellWidth: 42, fontStyle: 'bold' }, 1: { cellWidth: 'auto' } },
            margin: { left: margin, right: margin },
          });
          curY = doc.lastAutoTable.finalY + 8;

          // Stat row
          var statW = (pageW - margin * 2) / 3;
          [
            { label: 'Total Posts', value: String(data.stats.total_posts || 0) },
            { label: 'Published',   value: String(data.stats.published   || 0) },
            { label: 'Scheduled',   value: String(data.stats.scheduled   || 0) },
          ].forEach(function (s, i) {
            var x = margin + i * statW;
            doc.setFillColor(AMBER[0], AMBER[1], AMBER[2]);
            doc.roundedRect(x, curY, statW - 2, 20, 3, 3, 'F');
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(16);
            doc.setTextColor(WHITE[0], WHITE[1], WHITE[2]);
            doc.text(s.value, x + (statW - 2) / 2, curY + 10, { align: 'center' });
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(7.5);
            doc.text(s.label, x + (statW - 2) / 2, curY + 16, { align: 'center' });
          });
          curY += 26;

          // Platform breakdown
          var breakdown = data.stats.platform_breakdown || {};
          var totalForPct = data.stats.total_posts || 1;
          var breakdownRows = Object.keys(breakdown).map(function (plat) {
            var cnt = breakdown[plat];
            return [plat.charAt(0).toUpperCase() + plat.slice(1), String(cnt), ((cnt / totalForPct) * 100).toFixed(1) + '%'];
          });
          if (breakdownRows.length) {
            doc.autoTable({
              startY: curY,
              head: [['Platform', 'Posts', '% of Total']],
              body: breakdownRows,
              headStyles: { fillColor: SLATE, textColor: WHITE, fontStyle: 'bold', fontSize: 9 },
              bodyStyles: { fontSize: 9, cellPadding: 3 },
              alternateRowStyles: { fillColor: LIGHT },
              columnStyles: { 0: { cellWidth: 50 }, 1: { cellWidth: 25, halign: 'center' }, 2: { cellWidth: 30, halign: 'center' } },
              margin: { left: margin, right: margin },
            });
            curY = doc.lastAutoTable.finalY + 8;
          }

          // Post preview table
          var previewRows = (data.posts || []).map(function (p) {
            var content = (p.content || '').replace(/\n/g, ' ');
            var preview = content.length > 80 ? content.substring(0, 80) + '\u2026' : content;
            var sched = p.scheduled_time
              ? new Date(p.scheduled_time + (p.scheduled_time.endsWith('Z') ? '' : 'Z'))
                  .toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
              : '\u2014';
            var plat = (p.platform || '');
            plat = plat.charAt(0).toUpperCase() + plat.slice(1);
            return [plat, preview, (p.status || '').replace(/_/g, ' '), sched];
          });
          if (previewRows.length) {
            doc.autoTable({
              startY: curY,
              head: [['Platform', 'Content Preview', 'Status', 'Scheduled']],
              body: previewRows,
              headStyles: { fillColor: AMBER, textColor: SLATE, fontStyle: 'bold', fontSize: 8 },
              bodyStyles: { fontSize: 7.5, cellPadding: 2.5 },
              alternateRowStyles: { fillColor: LIGHT },
              columnStyles: { 0: { cellWidth: 22 }, 1: { cellWidth: 'auto' }, 2: { cellWidth: 22 }, 3: { cellWidth: 26 } },
              margin: { left: margin, right: margin },
              didParseCell: function (d) {
                if (d.column.index === 2) {
                  var v = (d.cell.raw || '').toLowerCase();
                  if (v === 'published') d.cell.styles.textColor = [22, 163, 74];
                  else if (v === 'failed')    d.cell.styles.textColor = [220, 38, 38];
                  else if (v.indexOf('sched') !== -1 || v === 'approved')
                    d.cell.styles.textColor = [217, 119, 6];
                }
              },
            });
          }

          addFooter();

          var safeName = (campaignName || 'Campaign').replace(/[^a-zA-Z0-9_\- ]/g, '').trim().replace(/\s+/g, '_');
          doc.save('BrokerAI_Report_' + safeName + '_' + new Date().toISOString().slice(0, 10) + '.pdf');

        } catch (e) {
          alert('Could not generate report: ' + (e.message || e));
        } finally {
          var t = document.getElementById('report-toast');
          if (t) t.remove();
        }
      }
      // ── /Campaign Performance Report ─────────────────────────────────────
    </script>
  </body>
</html>
