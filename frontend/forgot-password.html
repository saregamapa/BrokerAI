<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — BrokerAI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="brokerai-app min-h-screen bg-gradient-to-br from-slate-50 via-white to-amber-50/30 text-slate-900 antialiased">
  <header class="border-b border-slate-200/80 bg-white/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-lg items-center justify-between px-6 py-4">
      <a href="/" class="text-lg font-bold text-slate-900">Broker<span class="text-amber-500">AI</span></a>
      <a href="/login.html" class="text-sm font-semibold text-amber-700 hover:text-amber-800">Log in</a>
    </div>
  </header>

  <main class="mx-auto max-w-lg px-6 py-12">
    <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Reset your password</h1>
    <p class="mt-2 text-sm text-slate-600">Enter your email and we will send you a reset link if an account exists.</p>

    <form id="forgot-form" class="mt-8 space-y-5">
      <div>
        <label for="email" class="block text-sm font-semibold text-slate-700">Email</label>
        <input id="email" type="email" autocomplete="email" required
          class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-900 shadow-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-500/30" />
      </div>
      <p id="form-msg" class="hidden rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800"></p>
      <button type="submit" class="w-full rounded-xl bg-slate-900 py-3.5 text-sm font-bold text-white shadow-md transition hover:bg-slate-800">
        Send reset link
      </button>
    </form>
  </main>

  <script src="/static/js/app.js" defer></script>
  <script>
    document.getElementById("forgot-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var B = window.BrokerAI;
      if (!B) return;
      var email = document.getElementById("email").value.trim();
      var ve = B.validateEmail(email);
      var box = document.getElementById("form-msg");
      if (ve) {
        box.textContent = ve;
        box.classList.remove("hidden");
        return;
      }
      try {
        B.setLoading(true);
        await B.apiJson("/api/auth/forgot-password", {
          method: "POST",
          body: JSON.stringify({ email: email }),
        });
        box.textContent =
          "If an account exists for that email, we sent a reset link. Check your inbox.";
        box.classList.remove("hidden");
      } catch (err2) {
        box.textContent = "Something went wrong";
        box.classList.remove("hidden");
      } finally {
        B.setLoading(false);
      }
    });
  </script>
</body>
</html>
