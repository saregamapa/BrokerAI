<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BrokerAI — AI-powered social media campaigns for any business. Generate, schedule, and publish a month of content in minutes." />
    <meta name="og:site_name" content="BrokerAI" />
    <meta property="og:type" content="website" />
    <title>Reset password — BrokerAI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="brokerai-app min-h-screen bg-white text-slate-900 antialiased">
    <div id="brokerai-loading" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-white/70 backdrop-blur-sm">
      <div class="flex flex-col items-center gap-3 rounded-2xl border border-slate-200 bg-white/90 p-8 shadow-xl">
        <div class="brokerai-spinner" aria-label="Loading"></div>
        <p class="text-sm font-medium text-slate-600" data-brokerai-loading-text>Sending…</p>
      </div>
    </div>

    <div class="flex min-h-screen items-center justify-center px-6 py-12">
      <div class="w-full max-w-sm">
        <a href="/" class="mb-8 block text-xl font-bold text-[#0f172a]">
          Broker<span class="text-amber-500">AI</span>
        </a>

        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Reset your password</h1>
        <p class="mt-2 text-sm text-slate-600">
          Enter the email on your account and we'll send reset instructions.
        </p>

        <form id="forgot-form" class="mt-8 space-y-5" novalidate>
          <div>
            <label for="email" class="block text-sm font-medium text-slate-700">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              placeholder="you@example.com"
              class="mt-1.5 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-900 placeholder-slate-400 shadow-sm transition focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-500/25"
            />
          </div>
          <button
            type="submit"
            id="forgot-btn"
            class="w-full rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 py-3.5 text-sm font-bold text-white shadow-lg shadow-amber-500/25 transition duration-200 hover:scale-[1.02] hover:shadow-xl active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Send reset instructions
          </button>
        </form>

        <div id="forgot-success" class="mt-6 hidden rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800" role="status"></div>

        <p class="mt-8 text-center text-sm text-slate-600">
          Remember it now?
          <a href="/login.html" class="font-semibold text-amber-600 hover:underline">Back to log in</a>
        </p>
      </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
      var form = document.getElementById("forgot-form");
      var btn = document.getElementById("forgot-btn");
      var btnText = btn.textContent;
      var successBox = document.getElementById("forgot-success");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var email = (document.getElementById("email").value || "").trim();
        BrokerAI.clearFieldErrors(["email"]);
        var err = BrokerAI.validateEmail(email);
        if (err) { BrokerAI.setFieldError("email", err); return; }

        btn.disabled = true;
        btn.textContent = "Sending…";
        BrokerAI.setLoading(true);
        try {
          var res = await BrokerAI.apiJson("/auth/forgot-password", {
            method: "POST",
            body: JSON.stringify({ email: email }),
          });
          successBox.textContent = (res && res.message) ||
            "If that email exists, we'll send reset instructions shortly.";
          successBox.classList.remove("hidden");
          form.classList.add("hidden");
          BrokerAI.showToast("Check your email for next steps.", "success");
        } catch (err2) {
          BrokerAI.showToast(err2.message || "Couldn't send reset link — please try again.", "error");
        } finally {
          btn.disabled = false;
          btn.textContent = btnText;
          BrokerAI.setLoading(false);
        }
      });
    </script>
  </body>
</html>
