<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BrokerAI — Connect social media accounts via Ayrshare." />
    <title>Social accounts — BrokerAI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body
    class="brokerai-app min-h-screen bg-[#f9fafb] text-slate-900 antialiased"
    data-page="connect"
  >
    <div
      id="brokerai-loading"
      class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/20 backdrop-blur-sm"
    >
      <div class="flex max-w-sm flex-col items-center gap-4 rounded-2xl border border-slate-200/90 bg-white/95 p-10 shadow-2xl shadow-slate-300/50 ring-1 ring-slate-100">
        <div class="brokerai-spinner" aria-label="Loading"></div>
        <p class="text-center text-sm font-medium text-slate-700" data-brokerai-loading-text>Loading…</p>
      </div>
    </div>

    <div
      id="app-sidebar-overlay"
      class="fixed inset-0 z-30 hidden bg-slate-900/40 backdrop-blur-sm md:hidden"
      aria-hidden="true"
    ></div>

    <aside
      id="app-sidebar"
      class="fixed inset-y-0 left-0 z-40 w-64 border-r border-slate-800/80 bg-[#0f172a] shadow-xl md:block"
    ></aside>

    <div id="app-layout" class="flex min-h-screen flex-col md:pl-64">
      <header
        id="app-topnav"
        class="sticky top-0 z-20 border-b border-slate-200/80 bg-white/80 shadow-sm backdrop-blur-md"
      ></header>

      <main class="brokerai-page flex-1 bg-gradient-to-br from-[#f9fafb] via-white to-amber-50/25 px-4 py-8 md:px-10 md:py-10">
        <div class="mx-auto max-w-4xl space-y-8 pb-16">
          <!-- Page intro -->
          <header class="space-y-3">
            <p
              class="inline-flex items-center gap-2 rounded-full border border-amber-200/80 bg-amber-50/90 px-3 py-1 text-[11px] font-bold uppercase tracking-widest text-amber-800"
            >
              <span class="h-1.5 w-1.5 rounded-full bg-amber-500" aria-hidden="true"></span>
              Integrations
            </p>
            <div class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
              <div>
                <h1 class="text-3xl font-bold tracking-tight text-slate-900 md:text-4xl">Social accounts</h1>
                <p class="mt-2 max-w-2xl text-sm leading-relaxed text-slate-600 md:text-[15px]">
                  Link the networks you publish to. BrokerAI keeps connection status in sync with Ayrshare—refresh
                  anytime, or wait a few seconds after you return from the connect flow.
                </p>
              </div>
            </div>
          </header>

          <!-- Supported platforms (injected) -->
          <div id="social-supported-strip" class="scroll-mt-4"></div>

          <!-- Primary panel -->
          <section
            class="overflow-hidden rounded-2xl border border-slate-200/90 bg-white shadow-xl shadow-slate-200/50 ring-1 ring-slate-100/80"
            aria-labelledby="social-linked-heading"
          >
            <div
              class="border-b border-slate-100 bg-gradient-to-br from-slate-50/90 via-white to-amber-50/30 px-5 py-5 sm:px-6 sm:py-6"
            >
              <div class="flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
                <div class="min-w-0 space-y-1">
                  <h2 id="social-linked-heading" class="text-lg font-bold tracking-tight text-slate-900">
                    Linked accounts
                  </h2>
                  <p id="social-accounts-summary" class="text-sm text-slate-600">
                    Loading status…
                  </p>
                </div>
                <div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center sm:justify-end">
                  <div
                    id="social-last-sync-wrap"
                    class="inline-flex items-center gap-2 rounded-full border border-slate-200/90 bg-white/90 px-3 py-1.5 text-xs font-medium text-slate-600 shadow-sm"
                    title="Based on your most recently synced account"
                  >
                    <svg class="h-3.5 w-3.5 shrink-0 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span id="social-last-sync">—</span>
                  </div>
                  <div class="flex flex-wrap gap-2">
                    <button
                      type="button"
                      id="btn-connect"
                      class="inline-flex min-h-[44px] items-center justify-center gap-2 rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 px-5 py-2.5 text-sm font-bold text-white shadow-md shadow-amber-500/25 transition hover:from-amber-400 hover:to-amber-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400 focus-visible:ring-offset-2 active:scale-[0.98] disabled:pointer-events-none disabled:opacity-50"
                    >
                      <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                      </svg>
                      Connect account
                    </button>
                    <button
                      type="button"
                      id="btn-refresh"
                      class="inline-flex min-h-[44px] items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-800 shadow-sm transition hover:border-slate-300 hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-300 focus-visible:ring-offset-2 active:scale-[0.98] disabled:pointer-events-none disabled:opacity-50"
                    >
                      <svg class="h-4 w-4 shrink-0 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                      </svg>
                      Sync now
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="px-5 py-6 sm:px-6 sm:py-7">
              <p id="social-accounts-meta" class="mb-5 hidden rounded-xl border border-sky-100 bg-sky-50/80 px-4 py-3 text-sm leading-snug text-sky-900"></p>
              <div id="social-accounts-list" class="flex flex-col gap-3" role="list" aria-live="polite"></div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/socialAccountsManager.js"></script>
  </body>
</html>
