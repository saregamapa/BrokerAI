<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set new password — BrokerAI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="brokerai-app min-h-screen bg-gradient-to-br from-slate-50 via-white to-amber-50/30 text-slate-900 antialiased">
  <header class="border-b border-slate-200/80 bg-white/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-lg items-center justify-between px-6 py-4">
      <a href="/" class="text-lg font-bold text-slate-900">Broker<span class="text-amber-500">AI</span></a>
      <a href="/login.html" class="text-sm font-semibold text-amber-700 hover:text-amber-800">Log in</a>
    </div>
  </header>

  <main class="mx-auto max-w-lg px-6 py-12">
    <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Choose a new password</h1>
    <form id="reset-form" class="mt-8 space-y-5">
      <input type="hidden" id="token" />
      <div>
        <label for="password" class="block text-sm font-semibold text-slate-700">New password</label>
        <input id="password" type="password" autocomplete="new-password" required minlength="8"
          class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-900 shadow-sm focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-500/30" />
        <p class="mt-1 hidden text-xs font-medium text-red-600" data-error-for="password"></p>
      </div>
      <p id="form-error" class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"></p>
      <button type="submit" class="w-full rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 py-3.5 text-sm font-bold text-white shadow-lg shadow-amber-500/25">
        Update password
      </button>
    </form>
  </main>

  <script src="/static/js/app.js" defer></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var tok = params.get("token") || "";
      document.getElementById("token").value = tok;
      if (!tok) {
        var fe = document.getElementById("form-error");
        fe.textContent = "Missing reset token. Open the link from your email.";
        fe.classList.remove("hidden");
      }
    })();

    document.getElementById("reset-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var B = window.BrokerAI;
      if (!B) return;
      var tok = document.getElementById("token").value;
      var password = document.getElementById("password").value;
      B.setFieldError("password", null);
      var fe = document.getElementById("form-error");
      fe.classList.add("hidden");
      var vp = B.validatePassword(password);
      if (vp) {
        B.setFieldError("password", vp);
        return;
      }
      if (!tok) return;
      try {
        B.setLoading(true);
        await B.apiJson("/api/auth/reset-password", {
          method: "POST",
          body: JSON.stringify({ token: tok, password: password }),
        });
        B.showToast("Password updated. You can log in.", "success");
        setTimeout(function () { window.location.href = "/login.html"; }, 800);
      } catch (err2) {
        fe.textContent = (err2 && err2.message) || "Something went wrong";
        fe.classList.remove("hidden");
      } finally {
        B.setLoading(false);
      }
    });
  </script>
</body>
</html>
