<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BrokerAI — AI-powered social media campaigns for any business. Generate, schedule, and publish a month of content in minutes." />
    <meta name="og:site_name" content="BrokerAI" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/img/favicon.svg" />
    <meta name="theme-color" content="#f59e0b" />
  <title>Leads — BrokerAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <div class="flex items-center gap-3">
        <a href="/lead-forms.html" class="text-sm text-slate-500 hover:text-slate-700">← Lead forms</a>
        <h1 id="title" class="text-xl font-bold">Leads</h1>
      </div>
      <div class="flex items-center gap-2">
        <select id="form-picker" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"></select>
        <a id="btn-csv" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-bold text-white hover:bg-emerald-700" href="#">⬇ Export CSV</a>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-6 py-8">
    <div id="summary" class="mb-4 text-sm text-slate-600"></div>
    <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
      <table class="min-w-full text-sm">
        <thead class="bg-slate-50 text-xs uppercase text-slate-600">
          <tr id="thead-row"><th class="px-4 py-3 text-left">Captured</th></tr>
        </thead>
        <tbody id="tbody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
    <div id="empty" class="mt-6 hidden rounded-2xl border border-dashed border-slate-300 p-12 text-center text-sm text-slate-500">
      No leads captured yet. Share your public form link to start collecting leads.
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const token = localStorage.getItem("token") || localStorage.getItem("access_token") || "";
    if (!token) window.location.href = "/login.html?next=/leads.html";
    const api = async (path, opts = {}) => {
      const res = await fetch(path, {
        ...opts,
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}`, ...(opts.headers || {}) }
      });
      const txt = await res.text();
      let d; try { d = txt ? JSON.parse(txt) : {}; } catch { d = { raw: txt }; }
      if (!res.ok) throw new Error(d.detail || d.error || res.statusText);
      return d;
    };

    const qp = new URLSearchParams(window.location.search);
    let currentFormId = qp.get("form") || "";

    async function init() {
      const d = await api("/lead-forms");
      const items = d.items || [];
      const picker = $("form-picker"); picker.innerHTML = "";
      if (!items.length) {
        $("empty").classList.remove("hidden");
        $("title").textContent = "No forms yet";
        return;
      }
      items.forEach(f => {
        const opt = document.createElement("option");
        opt.value = String(f.id); opt.textContent = `${f.name} (${f.lead_count})`;
        picker.appendChild(opt);
      });
      if (!currentFormId || !items.find(x => String(x.id) === String(currentFormId))) currentFormId = String(items[0].id);
      picker.value = currentFormId;
      picker.addEventListener("change", () => { currentFormId = picker.value; loadForm(); });
      loadForm();
    }

    async function loadForm() {
      const form = await api(`/lead-forms/${currentFormId}`);
      $("title").textContent = `Leads — ${form.name}`;
      $("btn-csv").href = `/lead-forms/${currentFormId}/leads.csv?token=${encodeURIComponent(token)}`;
      // CSV link needs auth header, so do a programmatic fetch instead when clicked:
      $("btn-csv").addEventListener("click", async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`/lead-forms/${currentFormId}/leads.csv`, {
            headers: { "Authorization": `Bearer ${token}` }
          });
          if (!res.ok) throw new Error(await res.text());
          const blob = await res.blob();
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob); a.download = `leads_form_${currentFormId}.csv`; a.click();
        } catch (err) { BrokerAI.showToast(err.message || "Export failed", "error"); }
      });

      // Build header
      const head = $("thead-row"); head.innerHTML = '<th class="px-4 py-3 text-left">Captured</th>';
      (form.fields || []).forEach(f => {
        const th = document.createElement("th");
        th.className = "px-4 py-3 text-left"; th.textContent = f.label;
        head.appendChild(th);
      });
      const srcTh = document.createElement("th"); srcTh.className = "px-4 py-3 text-left"; srcTh.textContent = "Source"; head.appendChild(srcTh);

      const leads = await api(`/lead-forms/${currentFormId}/leads`);
      const items = leads.items || [];
      $("summary").textContent = `${items.length} lead${items.length===1?'':'s'} captured`;
      $("empty").classList.toggle("hidden", items.length > 0);
      const tb = $("tbody"); tb.innerHTML = "";
      items.forEach(l => {
        const tr = document.createElement("tr");
        const dt = new Date(l.captured_at);
        tr.innerHTML = `<td class="px-4 py-3 text-xs text-slate-500">${isNaN(dt)?l.captured_at:dt.toLocaleString()}</td>`;
        (form.fields || []).forEach(f => {
          const td = document.createElement("td"); td.className = "px-4 py-3";
          const v = l.data?.[f.key];
          td.textContent = v === true ? "✓" : (v === false || v === undefined || v === null) ? "" : String(v);
          tr.appendChild(td);
        });
        const srcTd = document.createElement("td"); srcTd.className = "px-4 py-3 text-xs text-slate-500";
        srcTd.textContent = [l.source, l.utm_campaign, l.utm_source].filter(Boolean).join(" • ") || "direct";
        tr.appendChild(srcTd);
        tb.appendChild(tr);
      });
    }

    init().catch(e => { BrokerAI.showToast(e.message || "Failed to load leads.", "error"); });
  </script>
<script src="/static/js/app.js" defer></script>
</body>
</html>
