<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BrokerAI — AI-powered social media campaigns for any business. Generate, schedule, and publish a month of content in minutes." />
    <meta name="og:site_name" content="BrokerAI" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/img/favicon.svg" />
    <meta name="theme-color" content="#f59e0b" />
  <title>Post Editor — BrokerAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 text-slate-900 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
      <div class="flex items-center gap-3">
        <a id="back-link" href="/dashboard.html" class="text-sm text-slate-500 hover:text-slate-700">← Back</a>
        <h1 class="text-xl font-bold">Post Editor</h1>
      </div>
      <span id="post-status" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600"></span>
    </div>
  </header>

  <main class="mx-auto flex w-full max-w-5xl flex-1 flex-col space-y-6 px-6 py-8">

    <!-- Basic post info -->
    <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-sm font-bold uppercase tracking-wide text-slate-500">Caption</h2>
      <p id="post-caption" class="mt-2 whitespace-pre-wrap text-sm text-slate-800"></p>
      <p id="post-meta" class="mt-3 text-xs text-slate-500"></p>
    </section>

    <!-- Carousel editor -->
    <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <div class="mb-4 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold">🎠 Carousel Slides</h2>
          <p class="text-xs text-slate-500">Create a multi-slide post. Supported on Instagram, Facebook, and LinkedIn.</p>
        </div>
        <label class="flex items-center gap-2 text-sm">
          <input id="is-carousel" type="checkbox" class="rounded" />
          <span class="font-semibold">Publish as carousel</span>
        </label>
      </div>

      <div id="slides-list" class="space-y-3"></div>

      <div class="mt-4 flex flex-wrap items-center gap-2">
        <button id="btn-add-slide" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold hover:bg-slate-50">+ Add slide</button>
        <button id="btn-ai-slides" class="rounded-lg bg-amber-500 px-3 py-2 text-sm font-bold text-white hover:bg-amber-600">✨ AI-generate slides</button>
        <button id="btn-save-slides" class="ml-auto rounded-lg bg-emerald-600 px-4 py-2 text-sm font-bold text-white hover:bg-emerald-700">Save slides</button>
      </div>
    </section>
  </main>

<script>
const TOKEN = BrokerAI.getToken() || "";
if (!TOKEN) { window.location.href = "/login.html"; }
const H = { "Authorization": `Bearer ${TOKEN}`, "Content-Type": "application/json" };
const $ = (id) => document.getElementById(id);

const params = new URLSearchParams(window.location.search);
const POST_ID = parseInt(params.get("id") || "0");
if (!POST_ID) { BrokerAI.showToast("Missing post id.", "error"); setTimeout(() => { window.location.href = "/dashboard.html"; }, 900); }

const state = { post: null, slides: [] };

function esc(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function api(path, opts={}) {
  const r = await fetch(path, { headers: H, ...opts });
  if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
  if (r.status === 204) return null;
  return r.json();
}

async function loadPost() {
  // There isn't a direct /posts/{id} fetch; use the campaign posts list via the post's campaign.
  // Simpler: we have GET /posts/{id}/slides which gives us slide data, and we can get the post
  // through the campaign. First hit slides endpoint, then fetch full post from its campaign.
  const s = await api(`/posts/${POST_ID}/slides`);
  state.slides = (s.slides || []).sort((a,b) => (a.order||0) - (b.order||0));
  $("is-carousel").checked = !!s.is_carousel;

  // Fetch post details via /posts/{id} if it exists, else try /posts/{id}/detail
  try {
    const p = await api(`/posts/${POST_ID}`);
    state.post = p;
    $("post-caption").textContent = p.caption || "(no caption)";
    $("post-meta").textContent = `${p.platform || "—"} · ${p.status} · campaign #${p.campaign_id}`;
    $("post-status").textContent = p.status || "";
    if (p.campaign_id) $("back-link").href = `/review.html?campaign_id=${p.campaign_id}`;
  } catch(e) {
    $("post-caption").textContent = "(unable to load post details)";
  }
  renderSlides();
}

function renderSlides() {
  const root = $("slides-list");
  root.innerHTML = "";
  if (!state.slides.length) {
    root.innerHTML = '<p class="rounded-lg border border-dashed border-slate-300 p-6 text-center text-sm text-slate-500">No slides yet. Click <strong>+ Add slide</strong> or <strong>AI-generate slides</strong>.</p>';
    return;
  }
  state.slides.forEach((s, idx) => {
    const div = document.createElement("div");
    div.className = "rounded-xl border border-slate-200 bg-slate-50 p-4";
    div.innerHTML = `
      <div class="mb-2 flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wide text-slate-500">Slide ${idx + 1}</span>
        <div class="flex gap-1">
          <button data-up="${idx}" ${idx === 0 ? "disabled" : ""} class="rounded border border-slate-300 px-2 py-1 text-xs disabled:opacity-40">↑</button>
          <button data-down="${idx}" ${idx === state.slides.length - 1 ? "disabled" : ""} class="rounded border border-slate-300 px-2 py-1 text-xs disabled:opacity-40">↓</button>
          <button data-del="${idx}" class="rounded border border-red-200 px-2 py-1 text-xs text-red-600 hover:bg-red-50">✕</button>
        </div>
      </div>
      <div class="grid gap-3 md:grid-cols-2">
        <div class="space-y-2">
          <input data-f="image_url" data-i="${idx}" type="url" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="https://…/slide.png" value="${esc(s.image_url)}" />
          <textarea data-f="caption_overlay" data-i="${idx}" rows="2" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Text to show on this slide">${esc(s.caption_overlay)}</textarea>
          <input data-f="alt_text" data-i="${idx}" type="text" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-xs" placeholder="Alt text (accessibility)" value="${esc(s.alt_text)}" />
        </div>
        <div class="flex min-h-[140px] items-center justify-center rounded-lg border border-slate-200 bg-white">
          ${s.image_url ? `<img src="${esc(s.image_url)}" class="max-h-48 rounded object-cover" onerror="this.style.display='none'" />` : '<span class="text-xs text-slate-400">preview</span>'}
        </div>
      </div>
    `;
    root.appendChild(div);
  });
  root.querySelectorAll("[data-f]").forEach(el => {
    el.addEventListener("input", e => {
      const i = parseInt(el.dataset.i);
      state.slides[i][el.dataset.f] = el.value;
    });
    el.addEventListener("change", e => {
      if (el.dataset.f === "image_url") renderSlides();
    });
  });
  root.querySelectorAll("[data-up]").forEach(b => b.onclick = () => {
    const i = parseInt(b.dataset.up);
    [state.slides[i-1], state.slides[i]] = [state.slides[i], state.slides[i-1]];
    renderSlides();
  });
  root.querySelectorAll("[data-down]").forEach(b => b.onclick = () => {
    const i = parseInt(b.dataset.down);
    [state.slides[i+1], state.slides[i]] = [state.slides[i], state.slides[i+1]];
    renderSlides();
  });
  root.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const i = parseInt(b.dataset.del);
    state.slides.splice(i, 1); renderSlides();
  });
}

$("btn-add-slide").onclick = () => {
  state.slides.push({ image_url: "", caption_overlay: "", alt_text: "", order: state.slides.length });
  renderSlides();
};

$("btn-ai-slides").onclick = async () => {
  const count = parseInt(prompt("How many slides (2–10)?", "5") || "5");
  const theme = prompt("Theme or topic (leave blank to use the post caption):", "") || "";
  const style = prompt("Style: educational | story | tips | listicle", "educational") || "educational";
  try {
    $("btn-ai-slides").disabled = true;
    $("btn-ai-slides").textContent = "Generating…";
    const j = await api(`/posts/${POST_ID}/slides/generate`, {
      method: "POST",
      body: JSON.stringify({ count, theme, style, use_existing_caption: !theme }),
    });
    const existing = state.slides.filter(s => s.image_url);
    state.slides = [...existing, ...(j.slides || []).map((s, i) => ({ ...s, order: existing.length + i }))];
    renderSlides();
  } catch(e) {
    BrokerAI.showToast("Generate failed: " + e.message, "error");
  } finally {
    $("btn-ai-slides").disabled = false;
    $("btn-ai-slides").textContent = "✨ AI-generate slides";
  }
};

$("btn-save-slides").onclick = async () => {
  try {
    const body = {
      slides: state.slides.map((s, i) => ({
        image_url: s.image_url || "",
        caption_overlay: s.caption_overlay || "",
        alt_text: s.alt_text || "",
        order: i,
      })),
      is_carousel: $("is-carousel").checked,
    };
    await api(`/posts/${POST_ID}/slides`, { method: "PUT", body: JSON.stringify(body) });
    $("btn-save-slides").textContent = "Saved ✓";
    BrokerAI.showToast("Slides saved.", "success");
    setTimeout(() => $("btn-save-slides").textContent = "Save slides", 1800);
  } catch(e) {
    BrokerAI.showToast("Save failed: " + e.message, "error");
  }
};

loadPost();
</script>
<script src="/static/js/app.js" defer></script>
</body>
</html>
