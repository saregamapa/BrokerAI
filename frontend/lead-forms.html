<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Forms — BrokerAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <div class="flex items-center gap-3">
        <a href="/dashboard.html" class="text-sm text-slate-500 hover:text-slate-700">← Dashboard</a>
        <h1 class="text-xl font-bold">Lead Forms</h1>
      </div>
      <button id="btn-new" class="rounded-lg bg-amber-500 px-4 py-2 text-sm font-bold text-white hover:bg-amber-600">+ New form</button>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-6 py-8">
    <div id="list" class="grid gap-4 md:grid-cols-2"></div>
    <div id="empty" class="hidden rounded-2xl border border-dashed border-slate-300 p-12 text-center text-sm text-slate-500">
      No lead forms yet. Create one to start capturing leads from your campaigns.
    </div>
  </main>

  <!-- Editor modal -->
  <div id="modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-900/60 p-4">
    <div class="flex max-h-[90vh] w-full max-w-2xl flex-col rounded-2xl bg-white shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4">
        <h3 id="modal-title" class="text-lg font-bold">New Lead Form</h3>
        <button id="modal-close" class="rounded-md px-2 py-1 text-slate-500 hover:bg-slate-100">✕</button>
      </div>
      <div class="flex-1 space-y-4 overflow-y-auto px-6 py-5">
        <div>
          <label class="mb-1 block text-xs font-semibold uppercase text-slate-600">Name (internal)</label>
          <input id="f-name" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Open House Leads — Jersey City" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-semibold uppercase text-slate-600">Headline</label>
          <input id="f-headline" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Get early access to our new listings" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-semibold uppercase text-slate-600">Description</label>
          <textarea id="f-desc" rows="2" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Share a sentence or two about what visitors will get."></textarea>
        </div>
        <div class="rounded-xl border border-slate-200 p-4">
          <div class="mb-3 flex items-center justify-between">
            <div class="text-sm font-semibold">Fields</div>
            <button id="btn-add-field" type="button" class="rounded-md border border-slate-300 px-3 py-1 text-xs font-semibold hover:bg-slate-50">+ Add field</button>
          </div>
          <div id="fields" class="space-y-2"></div>
        </div>
        <div class="grid gap-3 md:grid-cols-2">
          <div>
            <label class="mb-1 block text-xs font-semibold uppercase text-slate-600">Thank-you message</label>
            <textarea id="f-ty" rows="2" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">Thanks! We'll be in touch soon.</textarea>
          </div>
          <div>
            <label class="mb-1 block text-xs font-semibold uppercase text-slate-600">Redirect URL (optional)</label>
            <input id="f-redirect" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="https://your-site.com/thanks" />
          </div>
        </div>
        <label class="flex items-center gap-2 text-sm"><input id="f-active" type="checkbox" checked /> Form is active</label>
      </div>
      <div class="flex items-center justify-end gap-2 border-t border-slate-200 px-6 py-3">
        <button id="modal-cancel" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</button>
        <button id="modal-save" class="rounded-lg bg-amber-500 px-5 py-2 text-sm font-bold text-white hover:bg-amber-600">Save</button>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const token = localStorage.getItem("token") || localStorage.getItem("access_token") || "";
    if (!token) window.location.href = "/login.html?next=/lead-forms.html";
    const api = async (path, opts = {}) => {
      const res = await fetch(path, {
        ...opts,
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}`, ...(opts.headers || {}) }
      });
      const txt = await res.text();
      let d; try { d = txt ? JSON.parse(txt) : {}; } catch { d = { raw: txt }; }
      if (!res.ok) throw new Error(d.detail || d.error || res.statusText);
      return d;
    };
    const toast = (msg, err=false) => {
      const t = document.createElement("div");
      t.className = `fixed right-6 top-6 z-50 rounded-lg px-4 py-2 text-sm text-white shadow ${err?'bg-rose-600':'bg-slate-900'}`;
      t.textContent = msg; document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    };

    const FIELD_TYPES = ["text","email","phone","number","textarea","select","checkbox"];
    let editingId = null;

    function fieldRowHtml(f = { key: "", label: "", type: "text", required: true, placeholder: "", options: [], help_text: "" }) {
      const opts = FIELD_TYPES.map(t => `<option value="${t}" ${t===f.type?'selected':''}>${t}</option>`).join("");
      return `
        <div class="field-row flex flex-wrap items-end gap-2 rounded-lg bg-slate-50 p-3">
          <div class="min-w-[140px] flex-1">
            <div class="text-[10px] uppercase text-slate-500">Label</div>
            <input class="fr-label w-full rounded-md border border-slate-200 px-2 py-1 text-sm" value="${(f.label||'').replace(/"/g,'&quot;')}" placeholder="Full name" />
          </div>
          <div class="min-w-[120px]">
            <div class="text-[10px] uppercase text-slate-500">Key</div>
            <input class="fr-key w-full rounded-md border border-slate-200 px-2 py-1 text-sm" value="${(f.key||'').replace(/"/g,'&quot;')}" placeholder="full_name" />
          </div>
          <div>
            <div class="text-[10px] uppercase text-slate-500">Type</div>
            <select class="fr-type rounded-md border border-slate-200 px-2 py-1 text-sm">${opts}</select>
          </div>
          <label class="flex items-center gap-1 text-xs text-slate-700"><input type="checkbox" class="fr-req" ${f.required?'checked':''}/> required</label>
          <button type="button" class="fr-del rounded-md px-2 py-1 text-sm text-rose-600 hover:bg-rose-50">🗑</button>
        </div>`;
    }

    function addFieldRow(f) {
      const wrap = document.createElement("div");
      wrap.innerHTML = fieldRowHtml(f).trim();
      const row = wrap.firstElementChild;
      row.querySelector(".fr-del").addEventListener("click", () => row.remove());
      row.querySelector(".fr-label").addEventListener("input", (e) => {
        const keyEl = row.querySelector(".fr-key");
        if (!keyEl.dataset.touched) {
          keyEl.value = e.target.value.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 60);
        }
      });
      row.querySelector(".fr-key").addEventListener("input", (e) => { e.target.dataset.touched = "1"; });
      $("fields").appendChild(row);
    }

    function openEditor(form = null) {
      editingId = form ? form.id : null;
      $("modal-title").textContent = form ? "Edit Lead Form" : "New Lead Form";
      $("f-name").value = form?.name || "";
      $("f-headline").value = form?.headline || "";
      $("f-desc").value = form?.description || "";
      $("f-ty").value = form?.thank_you_message || "Thanks! We'll be in touch soon.";
      $("f-redirect").value = form?.redirect_url || "";
      $("f-active").checked = form ? form.is_active : true;
      $("fields").innerHTML = "";
      const fields = form?.fields || [
        { key: "name", label: "Full name", type: "text", required: true },
        { key: "email", label: "Email", type: "email", required: true },
        { key: "phone", label: "Phone", type: "phone", required: false },
      ];
      fields.forEach(addFieldRow);
      $("modal").classList.remove("hidden");
      $("modal").classList.add("flex");
    }
    function closeEditor() {
      $("modal").classList.add("hidden");
      $("modal").classList.remove("flex");
    }

    $("btn-new").addEventListener("click", () => openEditor(null));
    $("modal-close").addEventListener("click", closeEditor);
    $("modal-cancel").addEventListener("click", closeEditor);
    $("btn-add-field").addEventListener("click", () => addFieldRow());

    function collectFields() {
      const rows = document.querySelectorAll("#fields .field-row");
      const out = [];
      rows.forEach(r => {
        const label = r.querySelector(".fr-label").value.trim();
        let key = r.querySelector(".fr-key").value.trim().toLowerCase().replace(/[^a-z0-9_\-]+/g, "_");
        if (!label || !key) return;
        out.push({
          key, label,
          type: r.querySelector(".fr-type").value,
          required: r.querySelector(".fr-req").checked,
        });
      });
      return out;
    }

    $("modal-save").addEventListener("click", async () => {
      const payload = {
        name: $("f-name").value.trim() || "Untitled Lead Form",
        headline: $("f-headline").value.trim(),
        description: $("f-desc").value.trim(),
        fields: collectFields(),
        thank_you_message: $("f-ty").value.trim(),
        redirect_url: $("f-redirect").value.trim(),
        is_active: $("f-active").checked,
      };
      try {
        if (editingId) await api(`/lead-forms/${editingId}`, { method: "PUT", body: JSON.stringify(payload) });
        else await api("/lead-forms", { method: "POST", body: JSON.stringify(payload) });
        closeEditor();
        toast("Saved ✔︎");
        loadList();
      } catch (e) { toast(e.message, true); }
    });

    async function loadList() {
      try {
        const d = await api("/lead-forms");
        const list = $("list"); list.innerHTML = "";
        const items = d.items || [];
        $("empty").classList.toggle("hidden", items.length > 0);
        items.forEach(f => {
          const url = `${window.location.origin}/lead/${f.public_slug}`;
          const card = document.createElement("div");
          card.className = "rounded-2xl border border-slate-200 bg-white p-5 shadow-sm";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <div class="truncate text-base font-bold text-slate-900">${f.name}</div>
                <div class="mt-0.5 truncate text-xs text-slate-500">${f.headline || '—'}</div>
              </div>
              <span class="rounded-full ${f.is_active?'bg-emerald-100 text-emerald-700':'bg-slate-200 text-slate-600'} px-2 py-0.5 text-[10px] font-semibold">${f.is_active?'active':'inactive'}</span>
            </div>
            <div class="mt-3 flex items-center gap-3 text-xs text-slate-600">
              <span><b>${f.lead_count}</b> leads</span>
              <span>•</span>
              <span>${f.fields.length} fields</span>
            </div>
            <div class="mt-3 flex flex-wrap items-center gap-2">
              <a href="${url}" target="_blank" class="rounded-md border border-slate-300 px-3 py-1 text-xs font-semibold hover:bg-slate-50">Open public form ↗</a>
              <button data-act="copy" class="rounded-md border border-slate-300 px-3 py-1 text-xs font-semibold hover:bg-slate-50">Copy link</button>
              <a href="/leads.html?form=${f.id}" class="rounded-md border border-slate-300 px-3 py-1 text-xs font-semibold hover:bg-slate-50">View leads</a>
              <button data-act="edit" class="rounded-md border border-slate-300 px-3 py-1 text-xs font-semibold hover:bg-slate-50">Edit</button>
              <button data-act="del" class="rounded-md border border-rose-300 px-3 py-1 text-xs font-semibold text-rose-700 hover:bg-rose-50">Delete</button>
            </div>`;
          card.querySelector('[data-act="copy"]').addEventListener("click", async () => {
            try { await navigator.clipboard.writeText(url); toast("Link copied ✔︎"); } catch { toast(url); }
          });
          card.querySelector('[data-act="edit"]').addEventListener("click", () => openEditor(f));
          card.querySelector('[data-act="del"]').addEventListener("click", async () => {
            if (!confirm(`Delete "${f.name}" and all its leads?`)) return;
            try { await api(`/lead-forms/${f.id}`, { method: "DELETE" }); toast("Deleted"); loadList(); }
            catch (e) { toast(e.message, true); }
          });
          list.appendChild(card);
        });
      } catch (e) { toast(e.message, true); }
    }

    loadList();
  </script>
</body>
</html>
